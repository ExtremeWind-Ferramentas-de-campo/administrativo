<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Status RD EHS — Extreme Wind</title>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#2b7fd0">
<link rel="stylesheet" href="../assets/base.css">
<style>
  .filtros{
    display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);
    padding:16px;box-shadow:var(--sombra);margin-bottom:22px;align-items:end;
  }
  .filtros .campo{margin:0}
  .filtros .acoes{display:flex;gap:8px}
  .filtros .acoes .btn{flex:1}

  .placar{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:22px}
  .placar-item{
    background:var(--card);border:1px solid var(--linha);border-left:4px solid var(--c);
    border-radius:12px;padding:14px 16px;box-shadow:var(--sombra);
  }
  .placar-num{font-size:1.7rem;font-weight:800;line-height:1;color:var(--c)}
  .placar-rot{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:5px}

  .dia-info{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    font-size:.9rem;color:var(--muted);margin-bottom:16px;
  }
  .dia-info strong{color:var(--ink)}

  /* Cobrança: só quem FALTA enviar, em grade (2–3 por linha no computador,
     1 no celular). Quem já enviou aparece só em "encontrados". */
  .cobranca{display:grid;gap:10px;margin-bottom:30px;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
  .cob{
    display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--linha);
    border-left:4px solid var(--c);border-radius:10px;padding:10px 12px;box-shadow:var(--sombra);
  }
  .cob-ok{background:var(--ok-fraco);color:var(--ok);border-radius:10px;padding:12px 15px;font-size:.9rem;font-weight:600;margin-bottom:30px}
  .cob-txt{flex:1;min-width:0}
  .cob-parque{font-weight:700;font-size:.97rem}
  .cob-meta{font-size:.8rem;color:var(--muted);margin-top:2px}
  .cob-acao{flex:none}

  /* Autorizado: Sim / Não — um par de botões por parque + dia */
  .autoriz{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:9px;margin-top:2px;border-top:1px dashed var(--linha);cursor:default}
  .autoriz-rot{font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .autoriz-par{display:inline-flex;border:1px solid var(--linha);border-radius:999px;overflow:hidden}
  .autoriz-par button{
    font:inherit;font-size:.8rem;font-weight:700;padding:5px 14px;border:0;background:none;color:var(--muted);cursor:pointer;
  }
  .autoriz-par button + button{border-left:1px solid var(--linha)}
  .autoriz-par button:focus-visible{outline:2px solid var(--azul);outline-offset:-2px}
  .autoriz-par button[aria-pressed="true"][data-valor="SIM"]{background:var(--ok-fraco);color:var(--ok)}
  .autoriz-par button[aria-pressed="true"][data-valor="NAO"]{background:var(--erro-fraco);color:var(--erro)}
  .autoriz-par button:disabled{cursor:wait;opacity:.6}
  .autoriz-quem{font-size:.76rem;color:var(--faint)}
  /* situação do envio automático para os grupos do WhatsApp */
  .zap-auto{flex:1 0 100%;font-size:.76rem;font-weight:700}
  .zap-auto:empty{display:none}
  .zap-auto-fila{color:var(--alerta)}
  .zap-auto-ok{color:var(--ok)}
  .zap-auto-erro{color:var(--erro)}
  .zap-auto-neutro{color:var(--faint)}

  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  /* Stand by e Autorizado */
  .cob .btn-sb{flex:none}
  /* Dois botões não cabem ao lado do nome sem espremer o parque: vão numa
     linha própria, embaixo, alinhados à direita. */
  .cob:has(.cob-botoes){flex-wrap:wrap}
  .cob-botoes{display:flex;gap:6px;flex:1 0 100%;justify-content:flex-end;padding-top:8px;border-top:1px dashed var(--linha)}
  .cob .btn-aut{background:var(--ok);border-color:var(--ok)}
  .rdo.aut-manual{cursor:default;opacity:1}
  .aut-rodape{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .standby-lista{display:grid;gap:10px;margin-bottom:30px;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
  .sb{background:var(--card);border:1px solid var(--linha);border-left:4px solid var(--azul);border-radius:10px;
    padding:10px 12px;box-shadow:var(--sombra);display:flex;flex-direction:column;gap:6px}
  .sb-topo{display:flex;align-items:center;gap:8px;justify-content:space-between}
  .sb-motivo{font-size:.85rem;background:var(--azul-fraco);border-radius:8px;padding:7px 9px;white-space:pre-wrap;word-break:break-word}
  .sb-quem{font-size:.75rem;color:var(--faint)}
  .sb .etiqueta{align-self:flex-start}

  .modal-sb{position:fixed;inset:0;z-index:70;background:rgba(10,20,35,.5);display:none;align-items:center;justify-content:center;padding:16px}
  .modal-sb.aberto{display:flex}
  .modal-sb-cx{background:var(--card);border-radius:14px;max-width:440px;width:100%;padding:18px;box-shadow:var(--sombra-alta)}
  .modal-sb-cx h3{margin:0 0 4px;font-size:1.05rem}
  .modal-sb-cx p{margin:0 0 10px;font-size:.85rem;color:var(--muted)}
  .modal-sb-cx textarea{width:100%;min-height:96px;resize:vertical;font:inherit;padding:10px;border:1px solid var(--linha);
    border-radius:10px;background:var(--fundo,#fff);color:var(--ink);box-sizing:border-box}
  .modal-sb-rodape{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;align-items:center}
  .modal-sb-cont{font-size:.72rem;color:var(--faint);margin-right:auto}

  /* WhatsApp (compartilhamento do celular) */
  .zap{display:flex;gap:8px;align-items:center;flex-wrap:wrap;cursor:default}
  .zap[hidden]{display:none}
  .zap .btn{background:#1f8f4e;border-color:#1f8f4e}
  .zap-info{font-size:.74rem;color:var(--faint)}

  .rdo{
    border-left:5px solid var(--c,var(--azul));cursor:pointer;display:flex;flex-direction:column;gap:9px;
    transition:transform .15s ease,box-shadow .15s ease;
  }
  .rdo-cliente-tag{
    display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.06em;
    text-transform:uppercase;color:var(--c,var(--azul));
  }
  .legenda{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;font-size:.78rem;color:var(--muted)}
  .legenda span{display:inline-flex;align-items:center;gap:6px}
  .legenda i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .rdo:hover{transform:translateY(-3px);box-shadow:var(--sombra-alta)}
  .rdo:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
  .rdo.sem-link{cursor:default;opacity:.72}
  .rdo.sem-link:hover{transform:none;box-shadow:var(--sombra)}
  .rdo-parque{font-size:1.02rem;font-weight:700;line-height:1.25}
  .rdo-cliente{font-size:.84rem;color:var(--muted)}
  .rdo-linha{display:flex;gap:7px;flex-wrap:wrap}
  .rdo-abrir{font-size:.82rem;font-weight:700;color:var(--azul);display:flex;align-items:center;gap:6px;margin-top:2px}

  .carregando{text-align:center;padding:40px;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>

<header class="topo">
  <div class="topo-marca">
    <span class="topo-titulo">Status RD EHS</span>
    <span class="topo-sub">Supervisão de Campo</span>
  </div>
  <div class="topo-espaco"></div>
  <span class="topo-sub" id="quemSou"></span>
  <a class="topo-btn" href="supervisao-campo.html">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    <span class="rotulo">Voltar</span>
  </a>
</header>

<main class="conteudo">
  <div class="aviso" id="avisoTopo"></div>

  <div class="filtros">
    <div class="campo">
      <label for="f-data">Data do report</label>
      <input id="f-data" type="date">
    </div>
    <div class="campo">
      <label for="f-cliente">Cliente</label>
      <select id="f-cliente"><option value="">Todos</option></select>
    </div>
    <div class="campo">
      <label for="f-parque">Parque</label>
      <select id="f-parque"><option value="">Todos</option></select>
    </div>
    <div class="acoes">
      <button class="btn" id="btBuscar" type="button">Buscar</button>
      <button class="btn btn--vazado" id="btOntem" type="button">Ontem</button>
      <button class="btn btn--vazado" id="btHoje" type="button">Hoje</button>
    </div>
  </div>

  <div id="painel"><div class="carregando">Carregando…</div></div>
</main>

<div class="bloqueio" id="bloqueio" hidden>
  <div class="bloqueio-cx">
    <p class="bloqueio-msg" id="bloqueioMsg"></p>
    <button class="btn" id="bloqueioAcao" type="button">Ir para o portal</button>
  </div>
</div>
<div class="recado" id="recado" hidden></div>

<div class="modal-sb" id="modalSb" role="dialog" aria-modal="true" aria-labelledby="sbTit">
  <div class="modal-sb-cx">
    <h3 id="sbTit">Colocar em stand by</h3>
    <p id="sbParque"></p>
    <label for="sbMotivo" class="sr-only">Motivo</label>
    <textarea id="sbMotivo" maxlength="300" placeholder="Por que este parque não precisava enviar o report hoje? Ex.: equipe em deslocamento, parque parado por clima…"></textarea>
    <div class="modal-sb-rodape">
      <span class="modal-sb-cont" id="sbCont">0/300</span>
      <button class="btn btn--vazado" type="button" id="sbCancelar">Cancelar</button>
      <button class="btn" type="button" id="sbSalvar" disabled>Salvar</button>
    </div>
  </div>
</div>

<script src="../config/config.js"></script>
<script src="../assets/base.js"></script>
<script>
/* ============================================================================
   STATUS RD EHS
   Lê a aba "Reports EHS" da planilha do banco de dados do RDO (só leitura) e
   cruza com os projetos em andamento. Mesma mecânica do Status RDO.

   A cobrança sai dos projetos: cada projeto em andamento deveria ter um
   reporte de EHS na data escolhida, casado pelo NOME DO PARQUE. Por isso o
   parque cadastrado no projeto precisa bater com o que vai na aba Reports EHS —
   a comparação ignora acento e maiúscula, mas não adivinha nome diferente.

   Sábado e domingo entram como "não obrigatório": o reporte pode existir,
   mas a ausência não é cobrada.

   O EHS não tem avanço de reparo nem turbina/blade: o card traz data, parque,
   cliente, quem enviou e o PDF. Copiar os campos do RDO só encheria o card de
   etiqueta vazia.
   ============================================================================ */

/* A cor por cliente (corDoCliente) mora em assets/base.js: Projetos em
   Andamento usa a mesma, e duas cópias iam divergir na primeira alteração. */

function avisoTopo(txt, tipo){
  var el = document.getElementById('avisoTopo');
  if(!txt){ el.removeAttribute('data-tipo'); el.textContent = ''; return; }
  el.textContent = txt; el.setAttribute('data-tipo', tipo || 'erro');
}

function preencherFiltros(){
  return chamar('ehsFiltros', {})
    .then(function(res){
      if(!res || !res.ok) return;
      var sc = document.getElementById('f-cliente');
      var sp = document.getElementById('f-parque');
      (res.clientes || []).forEach(function(c){
        var o = document.createElement('option'); o.value = c; o.textContent = c; sc.appendChild(o);
      });
      (res.parques || []).forEach(function(p){
        var o = document.createElement('option'); o.value = p; o.textContent = p; sp.appendChild(o);
      });
    })
    .catch(function(){ /* filtros vazios não impedem a consulta */ });
}

function buscar(){
  var painel = document.getElementById('painel');
  painel.innerHTML = '<div class="carregando">Consultando os reports de EHS…</div>';
  avisoTopo('');

  return chamar('ehsStatus', {
    data:    document.getElementById('f-data').value,
    cliente: document.getElementById('f-cliente').value,
    parque:  document.getElementById('f-parque').value
  })
  .then(function(res){
    if(!res || !res.ok) throw { motivo: (res && res.motivo) || 'ERRO', detalhe: res && res.detalhe };
    desenhar(res);
  })
  .catch(function(err){
    if(err && err.motivo === 'SESSAO') return;
    painel.innerHTML = '';
    avisoTopo(traduzirErro(err) + (err && err.detalhe ? ' (' + err.detalhe + ')' : ''), 'erro');
  });
}

/* Autorizado (Sim / Não) — só no card de report que tem PDF.
   Vale para parque + data DO REPORT (não a do filtro). Clicar de novo na
   opção marcada desmarca: serve para o clique sem querer. */
function htmlAutoriz(parque, data, valor, quem, zap, zapDetalhe){
  var b = function(v, rot){
    return '<button type="button" data-valor="' + v + '" aria-pressed="' + (valor === v) + '"' +
           ' title="' + (valor === v ? 'Clique de novo para desmarcar' : rot) + '">' + rot + '</button>';
  };
  return '<div class="autoriz" data-parque="' + esc(parque) + '" data-data="' + esc(data) + '">' +
    '<span class="autoriz-rot">Autorizado</span>' +
    '<span class="autoriz-par" role="group" aria-label="Autorizado">' + b('SIM','Sim') + b('NAO','Não') + '</span>' +
    '<span class="autoriz-quem">' + (valor && quem ? 'por ' + esc(quem) : '') + '</span>' +
    '<span class="zap-auto" data-zap-auto>' + textoZapAuto(zap, zapDetalhe) + '</span>' +
  '</div>';
}

/* Situação do envio automático para os grupos (ZapEHS.gs). Autorizado = Sim
   põe o report na fila; o servidor envia em até ~1 minuto. */
var ZAP_AUTO = {
  NA_FILA:    ['fila',   'WhatsApp: na fila, enviando em instantes'],
  PENDENTE:   ['fila',   'WhatsApp: na fila, enviando em instantes'],
  ENVIANDO:   ['fila',   'WhatsApp: enviando para os grupos…'],
  ENVIADO:    ['ok',     'WhatsApp: enviado aos grupos ✓'],
  JA_ENVIADO: ['ok',     'WhatsApp: já tinha sido enviado aos grupos ✓'],
  ERRO:       ['erro',   'WhatsApp: falhou'],
  FALHOU:     ['erro',   'WhatsApp: não entrou na fila'],
  CANCELADO:  ['neutro', 'WhatsApp: envio cancelado']
};
function textoZapAuto(zap, detalhe){
  var z = ZAP_AUTO[zap];
  if(!z) return '';
  return '<span class="zap-auto-' + z[0] + '"' + (detalhe ? ' title="' + esc(detalhe) + '"' : '') + '>' +
         esc(z[1] + (zap === 'ERRO' && detalhe ? ' — ' + detalhe : '')) + '</span>';
}

function marcarAutoriz(grupo, clicado){
  var parque = grupo.getAttribute('data-parque');
  var data   = grupo.getAttribute('data-data');
  var botoes = grupo.querySelectorAll('button');
  var quem   = grupo.querySelector('.autoriz-quem');
  var antes = '';
  botoes.forEach(function(bt){
    if(bt.getAttribute('aria-pressed') === 'true') antes = bt.getAttribute('data-valor');
  });
  var valor = (antes === clicado) ? '' : clicado;    // mesma opção de novo = desmarcar
  var quemAntes = quem ? quem.textContent : '';

  var pintar = function(v){
    botoes.forEach(function(bt){
      var marcado = bt.getAttribute('data-valor') === v;
      bt.setAttribute('aria-pressed', String(marcado));
      bt.title = marcado ? 'Clique de novo para desmarcar' : bt.textContent;
    });
  };
  pintar(valor);                                     // marca na hora; desfaz se o servidor recusar
  botoes.forEach(function(bt){ bt.disabled = true; });

  chamar('ehsAutorizar', { data: data, parque: parque, valor: valor })
    .then(function(res){
      if(!res || !res.ok) throw { motivo: (res && res.motivo) || 'ERRO' };
      if(quem) quem.textContent = valor ? 'por ' + ((SESSAO && SESSAO.nome) || 'você') : '';
      var zap = grupo.parentNode && grupo.parentNode.querySelector('.zap');
      if(zap){ zap.hidden = (valor !== 'SIM'); }
      var auto = grupo.querySelector('[data-zap-auto]');
      if(auto && res.zap) auto.innerHTML = textoZapAuto(res.zap, '');
      recado(parque + ': ' + (valor === 'SIM' ? 'autorizado' : valor === 'NAO' ? 'não autorizado' : 'marcação removida') +
             (res.zap === 'NA_FILA' ? ' — envio para os grupos do WhatsApp em instantes.' : '.'), 'ok');
    })
    .catch(function(err){
      pintar(antes);
      if(quem) quem.textContent = quemAntes;
      if(err && err.motivo === 'SESSAO') return;
      recado(traduzirErro(err), 'erro');
    })
    .then(function(){ botoes.forEach(function(bt){ bt.disabled = false; }); });
}

/* ---------------------------------------------------------------------------
   STAND BY — tira o parque da cobrança do dia com um motivo
   --------------------------------------------------------------------------- */
var DATA_NA_TELA = '';
var SB_PARQUE = '';
var SB_MODO = 'standby';     // 'standby' | 'autorizado' — a mesma caixa serve aos dois

/* A caixa de texto é a mesma do Stand by; muda só o título e a dica.
   Autorizado = o report foi feito no modelo do CLIENTE (fora do nosso app),
   então nada chegou na planilha: a pessoa confirma aqui e o parque vai para
   "Reportes encontrados". */
var TEXTOS_CAIXA = {
  standby:    { tit:'Colocar em stand by', salvar:'Salvar',
                dica:'Por que este parque não precisava enviar o report hoje? Ex.: equipe em deslocamento, parque parado por clima…' },
  autorizado: { tit:'Marcar como autorizado', salvar:'Autorizar',
                dica:'Observação: ex.: report enviado no modelo do cliente por e-mail / grupo, conferido por…' }
};

function abrirStandby(parque, modo){
  SB_PARQUE = parque;
  SB_MODO = modo === 'autorizado' ? 'autorizado' : 'standby';
  var tx = TEXTOS_CAIXA[SB_MODO];
  document.getElementById('sbTit').textContent = tx.tit;
  document.getElementById('sbSalvar').textContent = tx.salvar;
  document.getElementById('sbParque').textContent = parque + ' · ' + dataBonita(DATA_NA_TELA);
  var t = document.getElementById('sbMotivo');
  t.placeholder = tx.dica;
  t.value = '';
  contarSb();
  document.getElementById('modalSb').classList.add('aberto');
  setTimeout(function(){ t.focus(); }, 30);
}
function fecharStandby(){ document.getElementById('modalSb').classList.remove('aberto'); SB_PARQUE = ''; }

function gravarAutorizado(parque, observacao, bt){
  if(bt){ bt.disabled = true; }
  return chamar('ehsAutorizadoManual', { data: DATA_NA_TELA, parque: parque, observacao: observacao })
    .then(function(res){
      if(!res || !res.ok) throw { motivo: (res && res.motivo) || 'ERRO' };
      recado(parque + (observacao ? ': autorizado.' : ': voltou para a cobrança.'), 'ok');
      fecharStandby();
      return buscar();
    })
    .catch(function(err){
      if(bt) bt.disabled = false;
      if(err && err.motivo === 'SESSAO') return;
      recado(traduzirErro(err), 'erro');
    });
}
function contarSb(){
  var t = document.getElementById('sbMotivo');
  document.getElementById('sbCont').textContent = t.value.length + '/300';
  document.getElementById('sbSalvar').disabled = !t.value.trim();
}
function gravarStandby(parque, motivo, bt){
  if(bt){ bt.disabled = true; }
  return chamar('ehsStandby', { data: DATA_NA_TELA, parque: parque, motivo: motivo })
    .then(function(res){
      if(!res || !res.ok) throw { motivo: (res && res.motivo) || 'ERRO' };
      recado(parque + (motivo ? ': em stand by.' : ': voltou para a cobrança.'), 'ok');
      fecharStandby();
      return buscar();
    })
    .catch(function(err){
      if(bt) bt.disabled = false;
      if(err && err.motivo === 'SESSAO') return;
      recado(traduzirErro(err), 'erro');
    });
}

/* ---------------------------------------------------------------------------
   WHATSAPP — compartilhamento do próprio celular (nada é enviado sozinho)
   Dois toques de propósito: o 1º busca PDF e fotos no servidor (pode levar
   alguns segundos); o 2º abre a folha de compartilhar. O navegador só deixa
   abrir essa folha logo depois de um toque — se juntasse os dois, a busca
   demorada faria o compartilhamento ser recusado.
   --------------------------------------------------------------------------- */
var ZAP_PRONTOS = {};   // chave data|parque -> { arquivos:[File], texto }

function chaveZap(data, parque){ return data + '|' + parque; }

function htmlZap(r){
  return '<div class="zap" data-zap-parque="' + esc(r.parque) + '" data-zap-data="' + esc(r.data) + '"' +
         (r.autorizado === 'SIM' ? '' : ' hidden') + '>' +
    '<button class="btn btn--pequeno" type="button" data-zap="preparar">Preparar envio no WhatsApp</button>' +
    '<span class="zap-info"></span>' +
  '</div>';
}

function base64ParaFile(b64, nome, tipo){
  var bin = atob(b64), n = bin.length, u = new Uint8Array(n);
  for(var i = 0; i < n; i++) u[i] = bin.charCodeAt(i);
  return new File([u], nome, { type: tipo || 'application/octet-stream' });
}

function prepararZap(caixa){
  var parque = caixa.getAttribute('data-zap-parque'), data = caixa.getAttribute('data-zap-data');
  var bt = caixa.querySelector('button'), info = caixa.querySelector('.zap-info');
  bt.disabled = true; bt.textContent = 'Buscando PDF e fotos…'; info.textContent = '';
  chamar('ehsArquivos', { data: data, parque: parque })
    .then(function(res){
      if(!res || !res.ok) throw { motivo: (res && res.motivo) || 'ERRO', detalhe: res && res.detalhe };
      var arquivos = (res.arquivos || []).map(function(a){ return base64ParaFile(a.base64, a.nome, a.tipo); });
      if(!arquivos.length) throw { motivo: 'SEM_ARQUIVO' };
      var pdfs = arquivos.filter(function(f){ return f.type === 'application/pdf'; });
      var fotos = arquivos.filter(function(f){ return f.type.indexOf('image/') === 0; });
      // Dois envios separados: o WhatsApp não aceita PDF e fotos no mesmo
      // compartilhamento (testado: o envio misturado não manda nada).
      // E cada envio vai em lotes: o Chrome recusa mais de 10 arquivos ou
      // mais de 50 MB por compartilhamento ("Permission denied").
      var lotesPdf = lotesZap(pdfs), lotesFotos = lotesZap(fotos);
      ZAP_PRONTOS[chaveZap(data, parque)] = { pdf: lotesPdf, fotos: lotesFotos, texto: res.texto || '' };
      caixa.innerHTML =
        botoesZap('pdf', lotesPdf, 'Enviar PDF no WhatsApp') +
        botoesZap('fotos', lotesFotos, 'Enviar fotos no WhatsApp') +
        '<span class="zap-info">' +
          (lotesFotos.length > 1 ? 'O WhatsApp aceita até ' + ZAP_MAX_ARQ + ' fotos por vez: envie um lote de cada vez. ' : '') +
          (res.incompleto ? 'Parte das fotos ficou de fora pelo tamanho.' : '') + '</span>';
    })
    .catch(function(err){
      bt.disabled = false; bt.textContent = 'Preparar envio no WhatsApp';
      if(err && err.motivo === 'SESSAO') return;
      info.textContent = traduzirErro(err) + (err && err.detalhe ? ' (' + err.detalhe + ')' : '');
    });
}

/* Testado no celular: com arquivos + texto o WhatsApp manda só o texto, e
   com PDF + fotos juntos não manda nada. Por isso são dois envios (PDF e
   fotos), cada um só com arquivos do mesmo tipo e sem texto. */
/* Limites do Chrome para navigator.share (share_service): 10 arquivos e
   50 MB por chamada. Passou disso, recusa com "Permission denied" — e o
   canShare() não avisa antes. Margem no tamanho por segurança. */
var ZAP_MAX_ARQ = 10;
var ZAP_MAX_BYTES = 45 * 1024 * 1024;

function lotesZap(arquivos){
  var lotes = [], atual = [], soma = 0;
  arquivos.forEach(function(f){
    if(atual.length && (atual.length >= ZAP_MAX_ARQ || soma + f.size > ZAP_MAX_BYTES)){
      lotes.push(atual); atual = []; soma = 0;
    }
    atual.push(f); soma += f.size;
  });
  if(atual.length) lotes.push(atual);
  return lotes;
}

function botoesZap(qual, lotes, rotulo){
  if(lotes.length === 1){
    return '<button class="btn btn--pequeno" type="button" data-zap-so="' + qual + '" data-zap-lote="0">' +
      rotulo + (qual === 'fotos' ? ' (' + lotes[0].length + ')' : '') + '</button>';
  }
  var ini = 1;
  return lotes.map(function(l, i){
    var txt = rotulo + ' — ' + (qual !== 'fotos' ? 'parte ' + (i + 1)
              : l.length === 1 ? 'foto ' + ini : 'fotos ' + ini + ' a ' + (ini + l.length - 1));
    ini += l.length;
    return '<button class="btn btn--pequeno" type="button" data-zap-so="' + qual + '" data-zap-lote="' + i + '">' + esc(txt) + '</button>';
  }).join('');
}

function compartilharZap(caixa, qual, lote){
  var parque = caixa.getAttribute('data-zap-parque'), data = caixa.getAttribute('data-zap-data');
  var pronto = ZAP_PRONTOS[chaveZap(data, parque)];
  if(!pronto){ prepararZap(caixa); return; }
  var lotes = qual === 'pdf' ? pronto.pdf : pronto.fotos;
  var i = Number(lote) || 0;
  var arquivos = (lotes && lotes[i]) || [];
  if(!arquivos.length){ recado(qual === 'fotos' ? 'Este report não tem fotos na pasta.' : 'Este report não tem PDF na pasta.', 'erro'); return; }
  var botao = caixa.querySelector('[data-zap-so="' + qual + '"][data-zap-lote="' + i + '"]');

  if(navigator.canShare && navigator.canShare({ files: arquivos })){
    navigator.share({ files: arquivos }).then(function(){
      if(botao){ botao.classList.add('btn--vazado'); botao.textContent = '✓ ' + botao.textContent.replace(/^✓ /, ''); }
      var faltam = qual === 'fotos' ? lotes.length - 1 - i : 0;
      recado(qual === 'pdf' ? 'PDF compartilhado. Agora envie as fotos.'
           : faltam > 0 ? 'Lote enviado. Agora envie o próximo lote de fotos.' : 'Fotos compartilhadas.', 'ok');
    }).catch(function(e){
      if(e && e.name === 'AbortError') return;          // a pessoa fechou a folha
      recado('O compartilhamento falhou: ' + (e && e.message ? e.message : 'erro'), 'erro');
    });
    return;
  }
  // Navegador sem compartilhamento de arquivos (comum no computador): baixa tudo
  arquivos.forEach(function(f, i){
    setTimeout(function(){
      var url = URL.createObjectURL(f), a = document.createElement('a');
      a.href = url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    }, i * 350);
  });
  recado('Este navegador não compartilha arquivos direto. Baixei os ' + arquivos.length +
         ' arquivos: anexe no grupo pelo WhatsApp. No celular, o botão abre o WhatsApp direto.', 'ok');
}

/* Card de "Reportes encontrados" para o parque autorizado à mão: não tem PDF
   (o report foi no modelo do cliente), mostra a observação e quem marcou. */
function htmlAutorizadoManual(r){

    '<div>' +
      '<div class="rdo-parque">' + esc(r.parque || '(sem parque)') + '</div>' +
      '<div class="rdo-cliente-tag">' + esc(r.cliente || 'sem cliente') + '</div>' +
    '</div>' +
    '<div class="rdo-linha">' +
      '<span class="etiqueta">' + esc(dataBonita(r.data)) + '</span>' +
      '<span class="etiqueta etiqueta--ok">Autorizado · modelo do cliente</span>' +
    '</div>' +
    (r.supervisor ? '<div class="rdo-cliente">Supervisor: ' + esc(r.supervisor) + '</div>' : '') +
    '<div class="sb-motivo">' + esc(r.observacao) + '</div>' +

      '<span class="sb-quem">' + (r.autorizadoPor ? 'por ' + esc(r.autorizadoPor) : '') + '</span>' +

    '</div>' +

}

function desenhar(res){
  var painel = document.getElementById('painel');
  // autorizado manualmente (modelo do cliente) conta como enviado
  var enviados = res.projetos.filter(function(p){ return p.estado === 'ENVIADO' || p.estado === 'AUTORIZADO'; }).length;
  var faltam   = res.projetos.filter(function(p){ return p.estado === 'FALTA'; }).length;
  var pendentes = res.projetos.filter(function(p){ return p.estado === 'FALTA' || p.estado === 'NAO_OBRIGATORIO'; });
  var emStandby = res.projetos.filter(function(p){ return p.estado === 'STANDBY'; });
  DATA_NA_TELA = res.data;

  var html = '';

  html += '<div class="dia-info">' +
    '<strong>' + esc(dataBonita(res.data)) + '</strong>' +
    '<span>· ' + esc(diaDaSemana(res.data)) + '</span>' +
    (res.fimDeSemana
      ? '<span class="etiqueta etiqueta--neutra">Fim de semana — reporte de EHS não é obrigatório</span>'
      : '') +
  '</div>';

  if(res.projetos.length){
    html += '<div class="placar">' +
      '<div class="placar-item" style="--c:var(--azul)"><div class="placar-num">' + res.projetos.length + '</div>' +
        '<div class="placar-rot">Projetos ativos</div></div>' +
      '<div class="placar-item" style="--c:var(--ok)"><div class="placar-num">' + enviados + '</div>' +
        '<div class="placar-rot">EHS enviado</div></div>' +
      '<div class="placar-item" style="--c:' + (res.fimDeSemana ? 'var(--alerta)' : 'var(--erro)') + '">' +
        '<div class="placar-num">' + (res.fimDeSemana ? pendentes.length : faltam) + '</div>' +
        '<div class="placar-rot">' + (res.fimDeSemana ? 'Sem EHS (livre)' : 'Falta enviar') + '</div></div>' +
      (emStandby.length
        ? '<div class="placar-item" style="--c:var(--azul)"><div class="placar-num">' + emStandby.length + '</div>' +
          '<div class="placar-rot">Stand by</div></div>' : '') +
    '</div>';

    html += '<h2 class="secao-tit">Cobrança do dia' + (pendentes.length ? ' (' + pendentes.length + ')' : '') + '</h2>';

    if(!pendentes.length){
      html += '<div class="cob-ok">' +
        (emStandby.length
          ? 'Nada pendente: quem não enviou está em stand by. Os relatórios enviados estão em "encontrados", abaixo.'
          : 'Todos os projetos enviaram o report de EHS desta data. Os relatórios estão em "encontrados", abaixo.') +
        '</div>';
    }else{
      html += '<div class="cobranca">';
      pendentes.sort(function(a,b){
        return (a.estado === b.estado ? 0 : (a.estado === 'FALTA' ? -1 : 1)) ||
               String(a.parque).localeCompare(String(b.parque));
      }).forEach(function(p){
        var falta = p.estado === 'FALTA';
        html += '<div class="cob" style="--c:' + (falta ? 'var(--erro)' : 'var(--alerta)') + '">' +
          '<div class="cob-txt">' +
            '<div class="cob-parque">' + esc(p.parque) + '</div>' +
            '<div class="cob-meta">' +
              esc(p.cliente || 'sem cliente') +
              (p.supervisor ? ' · sup. ' + esc(p.supervisor) : '') +
            '</div>' +
          '</div>' +
          '<span class="etiqueta ' + (falta ? 'etiqueta--falta' : 'etiqueta--neutra') + '">' +
            (falta ? 'Falta enviar' : 'Não obrigatório') + '</span>' +
          '<div class="cob-botoes">' +
            '<button class="btn btn--vazado btn--pequeno btn-sb" type="button" data-standby="' + esc(p.parque) + '"' +
              ' title="Não precisava enviar hoje: tira da cobrança com um motivo">Stand by</button>' +
            '<button class="btn btn--pequeno btn-aut" type="button" data-autorizar="' + esc(p.parque) + '"' +
              ' title="Report feito no modelo do cliente: marca como autorizado e manda para Reportes encontrados">Autorizado</button>' +
          '</div>' +
        '</div>';
      });
      html += '</div>';
    }

    if(emStandby.length){
      html += '<h2 class="secao-tit">Em stand by (' + emStandby.length + ')</h2>';
      html += '<div class="standby-lista">';
      emStandby.sort(function(a,b){ return String(a.parque).localeCompare(String(b.parque)); }).forEach(function(p){
        // TECNICO: o próprio técnico respondeu "Sim" no report do app de campo.
        // Não tem Desfazer (é o report dele), mas tem o PDF.
        var doTecnico = p.standbyOrigem === 'TECNICO';
        var pdfOk = doTecnico && /^https?:\/\//i.test(p.link || '');
        html += '<div class="sb' + (doTecnico ? ' sb-tecnico' : '') + '">' +
          '<div class="sb-topo">' +
            '<div><div class="cob-parque">' + esc(p.parque) + '</div>' +
              '<div class="cob-meta">' + esc(p.cliente || 'sem cliente') + (p.supervisor ? ' · sup. ' + esc(p.supervisor) : '') + '</div></div>' +
            (doTecnico
              ? (pdfOk ? '<button class="btn btn--pequeno" type="button" data-link="' + esc(p.link) + '">Abrir PDF</button>' : '')
              : '<button class="btn btn--vazado btn--pequeno" type="button" data-desfazer-sb="' + esc(p.parque) + '">Desfazer</button>') +
          '</div>' +
          (doTecnico ? '<span class="etiqueta etiqueta--azul">Informado pelo técnico no report</span>' : '') +
          (p.standbyMotivo ? '<div class="sb-motivo">' + esc(p.standbyMotivo) + '</div>' : '') +
          (p.standbyPor ? '<div class="sb-quem">' + (doTecnico ? 'report enviado por ' : 'por ') + esc(p.standbyPor) + '</div>' : '') +
        '</div>';
      });
      html += '</div>';
    }
  }else{
    html += (document.getElementById('f-cliente').value || document.getElementById('f-parque').value)
      ? '<div class="vazio">Nenhum projeto em andamento com esse cliente/parque.</div>'
      : '<div class="vazio">Nenhum projeto em andamento cadastrado. ' +
            'Cadastre em <strong>Projetos em Andamento</strong> para o sistema saber de quem cobrar o EHS.</div>';
  }

  html += '<h2 class="secao-tit">Reportes encontrados (' + res.total + ')</h2>';
  html += '<p class="secao-sub">Clique no card para abrir o PDF. Em Autorizado, clique de novo na opção marcada para desmarcar.</p>';
  // legenda das cores fica FORA da grade: dentro dela ocupava uma célula
  // e empurrava o primeiro card para a segunda coluna
  var clientes = [];
  res.relatorios.forEach(function(r){
    if(r.cliente && clientes.indexOf(r.cliente) === -1) clientes.push(r.cliente);
  });
  if(clientes.length > 1){
    html += '<div class="legenda">' + clientes.sort().map(function(c){
      return '<span><i style="background:' + corDoCliente(c) + '"></i>' + esc(c) + '</span>';
    }).join('') + '</div>';
  }

  html += '<div class="grade" id="listaRdo">';

  if(!res.relatorios.length){
    html += '<div class="vazio">Nenhum reporte com esses filtros.</div>';
  }else{
    res.relatorios.forEach(function(r){
      if(r.manual){ html += htmlAutorizadoManual(r); return; }
      var temLink = !!r.link;
      var cor = corDoCliente(r.cliente);

      html += '<div class="cartao rdo' + (temLink ? '' : ' sem-link') + '" style="--c:' + cor + '"' +
              (temLink ? ' tabindex="0" role="button" data-link="' + esc(r.link) + '"' : '') + '>' +
        '<div>' +
          '<div class="rdo-parque">' + esc(r.parque || '(sem parque)') + '</div>' +
          '<div class="rdo-cliente-tag">' + esc(r.cliente || 'sem cliente') + '</div>' +
        '</div>' +
        '<div class="rdo-linha">' +
          '<span class="etiqueta">' + esc(dataBonita(r.data)) + '</span>' +
          (r.standby ? '<span class="etiqueta etiqueta--azul">Stand by</span>' : '') +
        '</div>' +
        (r.supervisor ? '<div class="rdo-cliente">Supervisor: ' + esc(r.supervisor) + '</div>' : '') +
        ((r.autorNome || r.autor)
          ? '<div class="rdo-cliente">Enviado por ' + esc(r.autorNome || r.autor) + '</div>' : '') +
        (temLink
          ? '<div class="rdo-abrir">Abrir PDF ' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg></div>'
          : '<div class="rdo-cliente" style="color:var(--faint)">Sem link de PDF nesta linha</div>') +
        (temLink ? htmlAutoriz(r.parque, r.data, r.autorizado, r.autorizadoPor, r.zap, r.zapDetalhe) : '') +
        (temLink && r.temArquivos ? htmlZap(r) : '') +
      '</div>';
    });
  }
  html += '</div>';

  painel.innerHTML = html;
}

/* Um só ouvinte para todos os "abrir PDF", ligado UMA vez. Antes ficava dentro
   de desenhar(): o #painel não é recriado a cada busca, então cada busca
   somava mais um ouvinte e, depois de 3 buscas, um clique abria 3 abas. */
(function(){
  var painel = document.getElementById('painel');
  painel.addEventListener('click', function(e){
    var sb = e.target.closest('[data-standby]');
    if(sb){ abrirStandby(sb.getAttribute('data-standby'), 'standby'); return; }
    var au = e.target.closest('[data-autorizar]');
    if(au){ abrirStandby(au.getAttribute('data-autorizar'), 'autorizado'); return; }
    var dau = e.target.closest('[data-desfazer-aut]');
    if(dau){ gravarAutorizado(dau.getAttribute('data-desfazer-aut'), '', dau); return; }
    var dsb = e.target.closest('[data-desfazer-sb]');
    if(dsb){ gravarStandby(dsb.getAttribute('data-desfazer-sb'), '', dsb); return; }
    var so = e.target.closest('.zap [data-zap-so]');
    if(so){ compartilharZap(so.closest('.zap'), so.getAttribute('data-zap-so'), so.getAttribute('data-zap-lote')); return; }
    var zb = e.target.closest('.zap button[data-zap]');
    if(zb){
      var cx = zb.closest('.zap');
      prepararZap(cx);
      return;
    }
    if(e.target.closest('.zap')) return;
    var bt = e.target.closest('.autoriz button[data-valor]');
    if(bt){ marcarAutoriz(bt.closest('.autoriz'), bt.getAttribute('data-valor')); return; }
    if(e.target.closest('.autoriz')) return;          // clique na faixa do Autorizado não abre o PDF
    var alvo = e.target.closest('[data-link]');
    if(alvo) abrirPdf(alvo.getAttribute('data-link'));
  });
  painel.addEventListener('keydown', function(e){
    if(e.key !== 'Enter' && e.key !== ' ') return;
    if(e.target.closest('.autoriz') || e.target.closest('.zap')) return;   // Enter nos botões é dos botões, não do card
    var alvo = e.target.closest('[data-link]');
    if(alvo){ e.preventDefault(); abrirPdf(alvo.getAttribute('data-link')); }
  });
})();

function abrirPdf(link){
  if(!link) return;
  // Só abre endereço http(s): a célula da planilha é conteúdo de fora e não
  // deveria virar javascript: por acidente ou por mão errada.
  if(!/^https?:\/\//i.test(link)){
    recado('O link deste reporte não é um endereço válido.', 'erro');
    return;
  }
  window.open(link, '_blank', 'noopener');
}

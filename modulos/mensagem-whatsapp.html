<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Mensagem no WhatsApp — Extreme Wind</title>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#2b7fd0">
<link rel="stylesheet" href="../assets/base.css">
<style>
  .envio{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:14px 16px;box-shadow:var(--sombra);
    margin-bottom:18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .envio-txt{flex:1;min-width:220px;font-size:.88rem;color:var(--muted)}
  .envio-txt strong{color:var(--ink)}
  .barra{height:8px;border-radius:99px;background:var(--card-2);border:1px solid var(--linha);overflow:hidden;margin-top:8px}
  .barra span{display:block;height:100%;background:var(--ok);transition:width .4s}
  .zap-ico{width:18px;height:18px;vertical-align:-3px;margin-right:6px}
  .btn-zap{background:#1f9d55}

  .ferramentas{display:grid;gap:12px;grid-template-columns:minmax(0,1fr) minmax(0,320px);margin-bottom:12px;align-items:start}
  .ferramentas .campo{margin:0}
  @media(max-width:620px){ .ferramentas{grid-template-columns:1fr} }
  .dd{position:relative}
  .dd summary{list-style:none;cursor:pointer;background:var(--card-2);border:1px solid var(--linha);border-radius:10px;
    padding:11px 12px;min-height:44px;font-size:.95rem;display:flex;justify-content:space-between;gap:8px;align-items:center}
  .dd summary::-webkit-details-marker{display:none}
  .dd summary::after{content:'▾';color:var(--faint)}
  .dd[open] summary{border-color:var(--azul)}
  .dd-corpo{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;box-shadow:var(--sombra-alta);border-radius:12px;background:var(--card)}
  .dd-resumo{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .tabela-cx{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);box-shadow:var(--sombra);overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:.86rem;min-width:680px}
  th{background:var(--card-2);text-align:left;font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
     color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--linha);white-space:nowrap}
  td{padding:10px 12px;border-bottom:1px solid var(--linha);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  .tec-nome{font-weight:700;min-width:200px}
  .tec-mat{font-size:.74rem;color:var(--faint)}
  .fun{font-size:.78rem;color:var(--muted)}
  .tel{font-family:var(--mono);font-size:.8rem;white-space:nowrap}
  .tel.falta{color:var(--erro);font-family:var(--ff);font-weight:700;font-size:.76rem}
  .peq{font-size:.76rem;color:var(--muted);white-space:nowrap}
  .lem-ERRO{color:var(--erro)} .lem-PENDENTE{color:var(--alerta)} .lem-ENVIADO{color:var(--ok)}
  .bt-linha{border:1px solid var(--linha);background:none;color:var(--muted);font:inherit;font-size:.76rem;font-weight:700;
    border-radius:8px;padding:5px 9px;cursor:pointer;white-space:nowrap}
  .bt-linha:hover{border-color:#1f9d55;color:#1f9d55}
  .bt-linha:disabled{opacity:.4;cursor:default}
  .contador{font-size:.82rem;color:var(--muted);margin:0 2px 8px}

  .filtro-rot{font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:6px}
  .resumo-envio{font-size:.88rem;color:var(--muted);margin:14px 0;line-height:1.55}
  .resumo-envio strong{color:var(--ink)}
  .anexos{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
  .anexo{display:flex;align-items:center;gap:10px;background:var(--card-2);border:1px solid var(--linha);border-radius:10px;padding:8px 10px;font-size:.84rem}
  .anexo-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:.62rem;font-weight:800;color:#fff;flex:none;background:var(--faint)}
  .anexo-ico.imagem{background:#2b7fd0} .anexo-ico.video{background:#6a5acd} .anexo-ico.documento{background:#c0392b}
  .anexo-nome{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .anexo-est{font-size:.74rem;color:var(--muted);white-space:nowrap}
  .anexo-est.erro{color:var(--erro);font-weight:700}
  .anexo-est.ok{color:var(--ok);font-weight:700}
  .anexo-tirar{border:0;background:none;color:var(--muted);font-size:1.2rem;line-height:1;cursor:pointer;padding:2px 6px;border-radius:6px}
  .anexo-tirar:hover{color:var(--erro)}
  .bt-anexo{display:inline-flex;align-items:center;gap:7px}
  .carregando{text-align:center;padding:40px;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>

<header class="topo">
  <div class="topo-marca">
    <span class="topo-titulo">Mensagem no WhatsApp</span>
    <span class="topo-sub">Mensagens e Avisos</span>
  </div>
  <div class="topo-espaco"></div>
  <span class="topo-sub" id="quemSou"></span>
  <button class="topo-btn" id="btAtualizar" type="button" title="Recarregar">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    <span class="rotulo">Atualizar</span>
  </button>
  <a class="topo-btn" href="mensagens-avisos.html">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    <span class="rotulo">Voltar</span>
  </a>
</header>

<main class="conteudo">
  <div class="aviso" id="avisoTopo"></div>
  <div id="painel"><div class="carregando">Carregando…</div></div>
</main>

<div class="veu" id="veuEnvio" hidden>
  <div class="janela" role="dialog" aria-modal="true" aria-labelledby="envioTit">
    <div class="janela-cab">
      <div class="janela-tit" id="envioTit">Mensagem no WhatsApp</div>
      <button class="fechar" type="button" data-fechar aria-label="Fechar">×</button>
    </div>
    <div id="envioFiltros">
      <div class="filtro-rot">Para quais funções?</div>
      <div id="ckFuncaoEnvio"></div>
    </div>
    <div class="resumo-envio" id="envioResumo"></div>
    <div class="campo">
      <label for="envioMsg">Mensagem</label>
      <textarea id="envioMsg" maxlength="4000" rows="6" placeholder="Escreva o texto da mensagem…"></textarea>
      <span class="dica"><strong>{nome}</strong> vira o primeiro nome da pessoa. Negrito no WhatsApp: *assim*. Pode mandar só anexo, sem texto.</span>
    </div>
    <div class="anexos" id="anexos"></div>
    <input type="file" id="arquivo" multiple accept="image/jpeg,image/png,image/webp,video/mp4,video/3gpp,video/quicktime,application/pdf" hidden>
    <button class="btn btn--vazado btn--pequeno bt-anexo" type="button" id="btAnexo">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.1l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg>
      Adicionar anexo
    </button>
    <span class="dica" id="dicaAnexo" style="display:block;margin-top:6px;font-size:.74rem;color:var(--faint)"></span>
    <div class="janela-rodape">
      <button class="btn btn--vazado" type="button" data-fechar>Cancelar</button>
      <button class="btn btn-zap" type="button" id="btConfirmar">Enviar</button>
    </div>
  </div>
</div>

<div class="bloqueio" id="bloqueio" hidden>
  <div class="bloqueio-cx">
    <p class="bloqueio-msg" id="bloqueioMsg"></p>
    <button class="btn" id="bloqueioAcao" type="button">Ir para o portal</button>
  </div>
</div>
<div class="recado" id="recado" hidden></div>

<script src="../config/config.js"></script>
<script src="../assets/base.js"></script>
<script>
/* ============================================================================
   MENSAGEM NO WHATSAPP
   Todos da MINI MASTER com nome, função e telefone. Mensagem livre (texto +
   fotos, PDF, vídeos) para uma pessoa ou para todos das funções marcadas.
   Os anexos sobem para o Dropbox ao serem escolhidos; o envio entra na fila
   e o gatilho manda aos poucos (MensagensZap.gs).
   ============================================================================ */

Object.assign(MENSAGENS_MODULO, {
  SEM_DESTINATARIO: 'Ninguém com telefone válido na seleção.',
  MENSAGEM_VAZIA:   'Escreva o texto ou adicione um anexo.',
  TIPO_NAO_ACEITO:  'Tipo de arquivo não aceito. Use foto (JPG/PNG), PDF ou vídeo MP4.',
  GRANDE_DEMAIS:    'Arquivo grande demais para o WhatsApp.',
  ARQUIVO_INVALIDO: 'Não consegui ler o arquivo.',
  ANEXO_INVALIDO:   'Um dos anexos não é válido. Tire e adicione de novo.'
});

var DADOS = null;
var BUSCA = '';
var FUNCOES_TELA = null;          // null = todas
var CK_FUNCAO_TELA = null, CK_FUNCAO_ENVIO = null;
var ENVIO_ALVO = null;            // null = todos (por função); [matricula] = um só
var ANEXOS = [];                  // [{ id, nome, bytes, tipo, estado:'subindo'|'ok'|'erro', path, erro }]
var TIMER_ENVIO = null;
var SEM_FUNCAO = '(sem função)';
var LIMITES = { mb: 16, qtd: 5, texto: 4000, extensoes: ['jpg','jpeg','png','webp','mp4','3gp','mov','pdf'] };
var DEMO = /[?&]demo=1/.test(location.search);

function avisoTopo(txt, tipo){
  var el = document.getElementById('avisoTopo');
  if(!txt){ el.removeAttribute('data-tipo'); el.textContent = ''; return; }
  el.textContent = txt; el.setAttribute('data-tipo', tipo || 'erro');
}
function telBonito(t){
  var d = soDigitos(t);
  if(!/^55\d{10,11}$/.test(d)) return t;
  var n = d.slice(4);
  return '(' + d.slice(2,4) + ') ' + n.slice(0, n.length - 4) + '-' + n.slice(-4);
}
function primeiroNome(nome){
  var p = String(nome || '').split(' ')[0];
  return p.charAt(0).toUpperCase() + p.slice(1).toLowerCase();
}
function tamanho(b){ return b >= 1048576 ? (b / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }
function funcaoDe(t){ return t.funcao || SEM_FUNCAO; }
function iconeZap(){
  return '<svg class="zap-ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.2c0-.1-.2-.2-.5-.3z"/></svg>';
}

function pedir(acao, dados){
  if(DEMO) return new Promise(function(ok){ setTimeout(function(){ ok(demo(acao, dados)); }, acao === 'mensagemAnexar' ? 700 : 150); });
  return chamar(acao, dados);
}

/* ---------- carregar ---------- */
function carregar(silencioso){
  if(!silencioso) document.getElementById('painel').innerHTML = '<div class="carregando">Lendo a MINI MASTER…</div>';
  avisoTopo('');
  return pedir('mensagemContatos', {})
    .then(function(res){
      if(!res || !res.ok) throw { motivo: (res && res.motivo) || 'ERRO', detalhe: res && res.detalhe };
      DADOS = res;
      if(res.limites) LIMITES = res.limites;
      if(silencioso && document.getElementById('corpo')){ atualizarEnvioCaixa(); desenharLinhas(); }
      else desenhar();
      acompanharEnvio();
    })
    .catch(function(err){
      if(err && err.motivo === 'SESSAO') return;
      if(!silencioso) document.getElementById('painel').innerHTML = '';
      avisoTopo(traduzirErro(err) + (err && err.detalhe ? ' (' + err.detalhe + ')' : ''), 'erro');
    });
}
function acompanharEnvio(){
  if(TIMER_ENVIO){ clearTimeout(TIMER_ENVIO); TIMER_ENVIO = null; }
  if(DADOS && DADOS.envio && DADOS.envio.pendentes > 0) TIMER_ENVIO = setTimeout(function(){ carregar(true); }, 15000);
}

function opcoesFuncao(lista){
  var por = {};
  lista.forEach(function(t){ var f = funcaoDe(t); por[f] = (por[f] || 0) + 1; });
  return Object.keys(por).sort(function(a, b){
    return (a === SEM_FUNCAO) - (b === SEM_FUNCAO) || a.localeCompare(b, 'pt-BR');
  }).map(function(f){ return { valor: f, rotulo: f, qtd: por[f] }; });
}

/* ---------- tela ---------- */
function desenhar(){
  var html = '<div id="caixaEnvio"></div>' +
    '<div class="ferramentas">' +
      '<div class="campo"><label for="busca">Buscar</label>' +
        '<input id="busca" type="search" placeholder="Nome, matrícula ou telefone" value="' + esc(BUSCA) + '"></div>' +
      '<div class="campo"><label>Função</label>' +
        '<details class="dd" id="ddFuncao"><summary><span class="dd-resumo" id="ddResumo">Todas</span></summary>' +
        '<div class="dd-corpo" id="ckFuncaoTela"></div></details></div>' +
    '</div>' +
    '<div class="contador" id="contador"></div>' +
    '<div class="tabela-cx"><table><thead><tr>' +
      '<th>Nome</th><th>Função</th><th>WhatsApp</th><th>Último envio</th>' + (DADOS.podeEnviar ? '<th></th>' : '') +
    '</tr></thead><tbody id="corpo"></tbody></table></div>';
  document.getElementById('painel').innerHTML = html;

  var ops = opcoesFuncao(DADOS.contatos);
  CK_FUNCAO_TELA = montarChecklist(document.getElementById('ckFuncaoTela'), ops, FUNCOES_TELA, function(v){
    FUNCOES_TELA = v.length === ops.length ? null : v;
    resumoDd(ops);
    desenharLinhas();
  });
  resumoDd(ops);
  document.getElementById('busca').addEventListener('input', function(e){ BUSCA = e.target.value.trim(); desenharLinhas(); });
  atualizarEnvioCaixa();
  desenharLinhas();
}

function resumoDd(ops){
  var el = document.getElementById('ddResumo');
  if(!FUNCOES_TELA) el.textContent = 'Todas';
  else if(!FUNCOES_TELA.length) el.textContent = 'Nenhuma';
  else if(FUNCOES_TELA.length === 1) el.textContent = FUNCOES_TELA[0];
  else el.textContent = FUNCOES_TELA.length + ' de ' + ops.length + ' funções';
}

function atualizarEnvioCaixa(){
  var e = DADOS.envio, txt;
  if(!e) txt = 'Nenhuma mensagem enviada ainda por aqui.';
  else{
    var feitos = e.enviados + e.erros + (e.cancelados || 0);
    txt = '<strong>Último envio:</strong> ' + esc(e.em) + (e.por ? ' por ' + esc(e.por) : '') +
          (e.anexos ? ' · ' + e.anexos + ' anexo(s)' : '') + ' · <strong>' + e.enviados + '</strong> de ' + e.total + ' enviados' +
          (e.pendentes ? ' · <strong>' + e.pendentes + '</strong> na fila (com pausa entre as pessoas)' : '') +
          (e.erros ? ' · <span class="lem-ERRO"><strong>' + e.erros + '</strong> com erro</span>' : '') +
          '<div class="barra"><span style="width:' + (e.total ? Math.round(feitos * 100 / e.total) : 0) + '%"></span></div>';
  }
  var bt = DADOS.podeEnviar
    ? '<button class="btn btn-zap" type="button" id="btEnviarTodos">' + iconeZap() + 'Enviar a todos</button>'
    : '<span class="peq">Só ADMIN e SUPERVISOR enviam mensagens.</span>';
  document.getElementById('caixaEnvio').innerHTML = '<div class="envio"><div class="envio-txt">' + txt + '</div>' + bt + '</div>';
}

function visiveis(){
  var b = BUSCA.toLowerCase(), bd = soDigitos(BUSCA);
  return DADOS.contatos.filter(function(t){
    if(FUNCOES_TELA && FUNCOES_TELA.indexOf(funcaoDe(t)) < 0) return false;
    if(!b) return true;
    return String(t.nome).toLowerCase().indexOf(b) > -1 || String(t.matricula).indexOf(b) > -1 ||
           (bd.length >= 3 && String(t.telefone).indexOf(bd) > -1);
  });
}

function desenharLinhas(){
  var lista = visiveis();
  var semTel = lista.filter(function(t){ return !t.telefone; }).length;
  document.getElementById('contador').textContent = lista.length + ' pessoa(s)' + (semTel ? ' · ' + semTel + ' sem telefone válido' : '');
  var corpo = document.getElementById('corpo');
  if(!lista.length){
    corpo.innerHTML = '<tr><td colspan="5"><div class="vazio">Ninguém neste filtro.</div></td></tr>';
    return;
  }
  corpo.innerHTML = lista.map(function(t){
    var u = t.ultimo;
    var ult = !u ? '<span class="peq">—</span>'
      : '<span class="peq lem-' + esc(u.status) + '"' + (u.detalhe ? ' title="' + esc(u.detalhe) + '"' : '') + '>' +
        ({ ENVIADO: 'Enviado', PENDENTE: 'Na fila', ERRO: 'Erro', CANCELADO: 'Cancelado' }[u.status] || esc(u.status)) +
        (u.em ? '<br>' + esc(u.em) : '') + '</span>';
    return '<tr>' +
      '<td><div class="tec-nome">' + esc(t.nome) + '</div><div class="tec-mat">Mat. ' + esc(t.matricula) + '</div></td>' +
      '<td><span class="fun">' + esc(t.funcao || '—') + '</span></td>' +
      '<td>' + (t.telefone ? '<span class="tel">' + esc(telBonito(t.telefone)) + '</span>'
        : '<span class="tel falta" title="' + esc(t.telefoneCru ? 'Na planilha: ' + t.telefoneCru : 'Coluna vazia na MINI MASTER') + '">' +
          (t.telefoneCru ? 'Número inválido' : 'Sem telefone') + '</span>') + '</td>' +
      '<td>' + ult + '</td>' +
      (DADOS.podeEnviar ? '<td><button type="button" class="bt-linha" data-mat="' + esc(t.matricula) + '"' + (t.telefone ? '' : ' disabled') +
        '>Mensagem</button></td>' : '') +
    '</tr>';
  }).join('');
}

/* ---------- janela de envio ---------- */
function destinatarios(){
  if(ENVIO_ALVO) return DADOS.contatos.filter(function(t){ return ENVIO_ALVO.indexOf(t.matricula) > -1; });
  var fun = CK_FUNCAO_ENVIO ? CK_FUNCAO_ENVIO.valores() : [];
  return DADOS.contatos.filter(function(t){ return fun.indexOf(funcaoDe(t)) > -1; });
}

function abrirEnvio(matriculas){
  ENVIO_ALVO = matriculas;
  document.getElementById('envioFiltros').hidden = !!matriculas;
  if(!matriculas){
    // começa com as funções escolhidas no filtro da tela
    CK_FUNCAO_ENVIO = montarChecklist(document.getElementById('ckFuncaoEnvio'), opcoesFuncao(DADOS.contatos), FUNCOES_TELA, atualizarJanela);
  }
  document.getElementById('dicaAnexo').textContent = 'Fotos (JPG/PNG), PDF ou vídeo MP4 · até ' + LIMITES.mb + ' MB cada · no máximo ' + LIMITES.qtd + ' arquivos.';
  atualizarJanela();
  document.getElementById('veuEnvio').hidden = false;
  document.getElementById('envioMsg').focus();
}
function fecharEnvio(){ document.getElementById('veuEnvio').hidden = true; }

function atualizarJanela(){
  var alvo = destinatarios();
  var com = alvo.filter(function(t){ return t.telefone; });
  var sem = alvo.length - com.length;
  var r;
  if(ENVIO_ALVO){
    r = 'Para <strong>' + esc(com[0] ? com[0].nome : '') + '</strong> · ' + esc(telBonito(com[0] ? com[0].telefone : ''));
  }else if(!com.length){
    r = '<strong>Ninguém selecionado.</strong> Marque ao menos uma função.';
  }else{
    r = 'Vai para <strong>' + com.length + ' pessoa(s)</strong> no privado do WhatsApp.' +
        (sem ? ' <strong>' + sem + '</strong> sem telefone válido ficam de fora.' : '') +
        '<br>Envio aos poucos (uma pessoa a cada 4–8 s) para o número não ser bloqueado: uns <strong>' +
        Math.max(1, Math.ceil(com.length * (6 + ANEXOS.length * 2) / 60)) + ' min</strong>. Pode fechar a tela.';
  }
  document.getElementById('envioResumo').innerHTML = r;
  desenharAnexos();
  var subindo = ANEXOS.some(function(a){ return a.estado === 'subindo'; });
  var comErro = ANEXOS.some(function(a){ return a.estado === 'erro'; });
  var temConteudo = document.getElementById('envioMsg').value.trim() || ANEXOS.length;
  var bt = document.getElementById('btConfirmar');
  bt.disabled = !com.length || subindo || comErro || !temConteudo;
  bt.innerHTML = subindo ? 'Aguarde o anexo subir…' : iconeZap() + (ENVIO_ALVO ? 'Enviar' : 'Enviar para ' + com.length);
  document.getElementById('btAnexo').disabled = ANEXOS.length >= LIMITES.qtd;
}

function desenharAnexos(){
  var rot = { imagem: 'FOTO', video: 'VÍDEO', documento: 'PDF' };
  document.getElementById('anexos').innerHTML = ANEXOS.map(function(a){
    return '<div class="anexo"><span class="anexo-ico ' + esc(a.tipo) + '">' + (rot[a.tipo] || '') + '</span>' +
      '<span class="anexo-nome" title="' + esc(a.nome) + '">' + esc(a.nome) + '</span>' +
      '<span class="anexo-est ' + (a.estado === 'erro' ? 'erro' : a.estado === 'ok' ? 'ok' : '') + '">' +
        (a.estado === 'subindo' ? 'Subindo…' : a.estado === 'erro' ? esc(a.erro) : tamanho(a.bytes)) + '</span>' +
      '<button type="button" class="anexo-tirar" data-tirar="' + esc(a.id) + '" aria-label="Tirar ' + esc(a.nome) + '">×</button></div>';
  }).join('');
}

function tipoDoNome(nome){
  var ext = (String(nome).match(/\.([a-z0-9]+)$/i) || [])[1];
  ext = ext ? ext.toLowerCase() : '';
  if(LIMITES.extensoes.indexOf(ext) < 0) return '';
  return /^(jpe?g|png|webp)$/.test(ext) ? 'imagem' : ext === 'pdf' ? 'documento' : 'video';
}

/* Foto grande vira JPEG de até 2560 px: o WhatsApp recomprime de qualquer jeito
   e assim o upload fica rápido no celular. */
function prepararImagem(file){
  return new Promise(function(ok){
    if(file.size < 3 * 1048576 || !/^image\/(jpeg|png|webp)$/.test(file.type)) return ok(file);
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function(){
      var fator = Math.min(1, 2560 / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * fator); c.height = Math.round(img.height * fator);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){
        if(!b) return ok(file);
        ok(new File([b], file.name.replace(/\.[a-z0-9]+$/i, '') + '.jpg', { type: 'image/jpeg' }));
      }, 'image/jpeg', 0.85);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); ok(file); };
    img.src = url;
  });
}

function lerBase64(file){
  return new Promise(function(ok, falha){
    var r = new FileReader();
    r.onload = function(){ ok(String(r.result).split(',')[1] || ''); };
    r.onerror = function(){ falha({ motivo: 'ARQUIVO_INVALIDO' }); };
    r.readAsDataURL(file);
  });
}

function adicionarArquivos(files){
  Array.prototype.slice.call(files).forEach(function(f){
    if(ANEXOS.length >= LIMITES.qtd){ recado('No máximo ' + LIMITES.qtd + ' anexos por mensagem.', 'erro'); return; }
    var a = { id: uid('ax'), nome: f.name, bytes: f.size, tipo: tipoDoNome(f.name), estado: 'subindo' };
    ANEXOS.push(a);
    if(!a.tipo){ a.estado = 'erro'; a.erro = 'Tipo não aceito'; return; }
    prepararImagem(f).then(function(arq){
      a.nome = arq.name; a.bytes = arq.size;
      if(arq.size > LIMITES.mb * 1048576) throw { motivo: 'GRANDE_DEMAIS' };
      return lerBase64(arq);
    }).then(function(b64){
      if(ANEXOS.indexOf(a) < 0) return;            // tirado enquanto lia
      return pedir('mensagemAnexar', { nome: a.nome, base64: b64 }).then(function(res){
        if(!res || !res.ok) throw { motivo: (res && res.motivo) || 'ERRO' };
        a.estado = 'ok'; a.path = res.anexo.path; a.tipo = res.anexo.tipo;
      });
    }).catch(function(err){
      if(err && err.motivo === 'SESSAO') return;
      a.estado = 'erro';
      a.erro = err && err.motivo === 'GRANDE_DEMAIS' ? 'Acima de ' + LIMITES.mb + ' MB' : traduzirErro(err);
    }).then(atualizarJanela);
  });
  atualizarJanela();
}

function confirmarEnvio(){
  var com = destinatarios().filter(function(t){ return t.telefone; });
  if(!com.length) return;
  var texto = document.getElementById('envioMsg').value.trim();
  if(!ENVIO_ALVO && !confirm('Mandar esta mensagem para ' + com.length + ' pessoa(s) no WhatsApp?')) return;
  var bt = document.getElementById('btConfirmar');
  bt.disabled = true; bt.textContent = 'Colocando na fila…';
  pedir('mensagemEnviar', {
    mensagem: texto,
    anexos: ANEXOS.filter(function(a){ return a.estado === 'ok'; }).map(function(a){ return { path: a.path, nome: a.nome }; }),
    matriculas: com.map(function(t){ return t.matricula; })
  }).then(function(res){
    if(!res || !res.ok) throw { motivo: (res && res.motivo) || 'ERRO', detalhe: res && res.detalhe };
    fecharEnvio();
    ANEXOS = [];
    document.getElementById('envioMsg').value = '';
    recado(res.naFila + ' mensagem(ns) na fila de envio.', 'ok');
    return carregar(true);
  }).catch(function(err){
    atualizarJanela();
    if(err && err.motivo === 'SESSAO') return;
    recado(traduzirErro(err), 'erro');
  });
}

/* ---------- eventos ---------- */
document.getElementById('painel').addEventListener('click', function(e){
  if(e.target.closest('#btEnviarTodos')){ abrirEnvio(null); return; }
  var l = e.target.closest('.bt-linha');
  if(l) abrirEnvio([l.getAttribute('data-mat')]);
});
document.addEventListener('click', function(e){
  var dd = document.getElementById('ddFuncao');
  if(dd && dd.open && !dd.contains(e.target)) dd.open = false;
});
document.querySelectorAll('[data-fechar]').forEach(function(b){ b.addEventListener('click', fecharEnvio); });
document.getElementById('veuEnvio').addEventListener('click', function(e){ if(e.target === this) fecharEnvio(); });
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') fecharEnvio(); });
document.getElementById('envioMsg').addEventListener('input', atualizarJanela);
document.getElementById('btAnexo').addEventListener('click', function(){ document.getElementById('arquivo').click(); });
document.getElementById('arquivo').addEventListener('change', function(e){ adicionarArquivos(e.target.files); e.target.value = ''; });
document.getElementById('anexos').addEventListener('click', function(e){
  var t = e.target.closest('[data-tirar]');
  if(!t) return;
  var id = t.getAttribute('data-tirar');
  ANEXOS = ANEXOS.filter(function(a){ return a.id !== id; });
  atualizarJanela();
});
document.getElementById('btConfirmar').addEventListener('click', confirmarEnvio);
document.getElementById('btAtualizar').addEventListener('click', function(){ carregar(false); });

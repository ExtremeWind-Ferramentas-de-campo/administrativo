<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>TimeSheet Semanal — Extreme Wind</title>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#2b7fd0">
<link rel="stylesheet" href="../assets/base.css">
<style>
  .conteudo{max-width:1500px}
  .filtros{display:grid;gap:12px;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1.3fr) auto;align-items:end;margin-bottom:18px}
  .filtros .campo{margin:0}
  @media(max-width:720px){ .filtros{grid-template-columns:1fr} }

  .ts-cab{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);box-shadow:var(--sombra);overflow:hidden;margin-bottom:14px}
  .ts-titulo{background:#1c3557;color:#fff;text-align:center;font-weight:800;letter-spacing:.04em;padding:12px 16px;font-size:1.05rem}
  .ts-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--linha)}
  .ts-info div{background:var(--card);padding:10px 14px}
  .ts-info span{display:block;font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .ts-info strong{font-size:.98rem}
  .ts-info .destaque strong{color:var(--azul)}

  .barra-fer{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--alerta-fraco);color:var(--ink);
    border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:.88rem}
  .barra-fer strong{color:var(--alerta)}
  .barra-fer .esp{flex:1}
  .dica-fer{font-size:.8rem;color:var(--muted);margin-bottom:10px}

  .tabela-cx{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);box-shadow:var(--sombra);overflow-x:auto}
  table.ts{border-collapse:collapse;font-size:.8rem;min-width:1650px;width:100%}
  .ts th{background:#1c3557;color:#fff;font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.02em;
    padding:8px 6px;border:1px solid #2c4a72;text-align:center;line-height:1.2;vertical-align:middle}
  .ts th.sb{background:#2b4c7e}
  .ts td{padding:7px 6px;border:1px solid var(--linha);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
  .ts td.txt{text-align:left;white-space:normal;min-width:150px}
  .ts td.obs{min-width:220px}
  .ts td.nome{min-width:210px;font-size:.74rem;line-height:1.35}
  /* cores das colunas (iguais no PDF: CORES_PDF) */
  .ts td.cor-az{background:#dbeafe;color:#0e2033}
  .ts td.cor-lj{background:#fde4c8;color:#0e2033}
  .ts td.cor-cz{background:#e7eaee;color:#0e2033}
  .ts tr.sem-rdo td{color:var(--faint)}
  .ts tr.sem-rdo td.cor-az,.ts tr.sem-rdo td.cor-lj,.ts tr.sem-rdo td.cor-cz{color:#8798a8}
  .ts tr.dia-100 td.c-dia{color:var(--erro);font-weight:700}
  .ts td.fer{cursor:pointer;user-select:none;font-weight:700;color:var(--muted);position:relative}
  .ts td.fer:hover{background:var(--azul-fraco)}
  .ts td.fer.sim{color:var(--erro);background:var(--erro-fraco)}
  .ts td.fer.sel{outline:2px solid var(--azul);outline-offset:-2px;background:var(--azul-fraco)}
  .ts td.fer:focus-visible{outline:2px solid var(--azul);outline-offset:-2px}
  .ts tr.tot td{background:#dce6f2;color:#0e2033;font-weight:800}
  .ts tr.geral td{background:#1c3557;color:#fff;font-weight:800}
  .ts td.rot{text-align:right;padding-right:10px}
  :root[data-theme="dark"] .ts tr.tot td{background:#22344b;color:var(--ink)}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .ts tr.tot td{background:#22344b;color:var(--ink)} }

  .carregando{text-align:center;padding:40px;color:var(--muted);font-size:.9rem}
  .rodape-ts{font-size:.76rem;color:var(--faint);margin-top:10px}
</style>
</head>
<body>

<header class="topo">
  <div class="topo-marca">
    <span class="topo-titulo">TimeSheet Semanal</span>
    <span class="topo-sub">Supervisão de Campo</span>
  </div>
  <div class="topo-espaco"></div>
  <span class="topo-sub" id="quemSou"></span>
  <button class="topo-btn topo-btn--forte" id="btPdf" type="button" disabled>
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
    <span class="rotulo">Baixar PDF</span>
  </button>
  <a class="topo-btn" href="supervisao-campo.html">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    <span class="rotulo">Voltar</span>
  </a>
</header>

<main class="conteudo">
  <div class="aviso" id="avisoTopo"></div>

  <div class="filtros">
    <div class="campo">
      <label for="fCliente">Cliente</label>
      <select id="fCliente" disabled><option>Carregando…</option></select>
    </div>
    <div class="campo">
      <label for="fParque">Projeto / Parque</label>
      <select id="fParque" disabled><option>Carregando…</option></select>
    </div>
    <div class="campo">
      <label for="fSemana">Semana</label>
      <select id="fSemana" disabled></select>
    </div>
    <button class="btn btn--vazado" id="btAtualizar" type="button">Atualizar</button>
  </div>

  <div id="painel"><div class="carregando">Lendo a planilha do RDO…</div></div>
</main>

<div class="bloqueio" id="bloqueio" hidden>
  <div class="bloqueio-cx">
    <p class="bloqueio-msg" id="bloqueioMsg"></p>
    <button class="btn" id="bloqueioAcao" type="button">Ir para o portal</button>
  </div>
</div>
<div class="recado" id="recado" hidden></div>

<script src="../config/config.js"></script>
<script src="../assets/base.js"></script>
<script>
/* ============================================================================
   TIMESHEET SEMANAL
   Mesmo quadro da aba "Timesheet_semanal" da planilha do RDO, para todos os
   clientes (filtro Cliente). O servidor calcula (TimesheetNordex.gs) com as mesmas
   regras das fórmulas. A coluna FERIADO pode ser alterada aqui: selecione uma
   ou mais células e clique em "Marcar SIM" (ou "NÃO"). Feriado e domingo
   viram 100%.
   ============================================================================ */

Object.assign(MENSAGENS_MODULO, {
  PARQUE_DESCONHECIDO: 'Esse parque não foi encontrado na planilha do RDO.',
  DADOS_INVALIDOS:   'Escolha o parque e a semana.'
});

var DEMO = /[?&]demo=1/.test(location.search);
var PARQUES = [];          // [{parque, cliente, num, semanas:[{ano,semana,ini,fim}]}]
var TS = null;             // resposta da semana
var SEL = {};              // datas selecionadas na coluna feriado
var ULTIMO_SEL = null;
var SALVANDO = false;

var COLUNAS = [
  { k:'data',       t:'Data' },
  { k:'dia',        t:'Dia da semana' },
  { k:'feriado',    t:'Feriado' },
  { k:'tecnicos',   t:'Nº de técnicos' },
  { k:'nomes',      t:'Nome', txt:1, nome:1 },
  { k:'jornada',    t:'Total jornada', h:1, cor:'cz' },
  { k:'ini50',      t:'Hora inic. extra 50%' },
  { k:'fim50',      t:'Hora fim extra 50%' },
  { k:'extra50',    t:'Jornada extra 50%', h:1, cor:'lj' },
  { k:'ini100',     t:'Hora inic. extra 100%' },
  { k:'fim100',     t:'Hora fim extra 100%' },
  { k:'extra100',   t:'Jornada extra 100%', h:1, cor:'lj' },
  { k:'sbNormal',   t:'Stand by normal', h:1, sb:1, cor:'az' },
  { k:'sbClima',    t:'Stand by clima', h:1, sb:1, cor:'az' },
  { k:'sbExtreme',  t:'Stand by extreme', h:1, sb:1, cor:'az' },
  { k:'soma',       t:'Soma horas trabalhadas', h:1, cor:'cz' },
  { k:'blade',      t:'Blade' },
  { k:'wtg',        t:'WTG' },
  { k:'tipoReparo', t:'Tipo reparo', txt:1 },
  { k:'atividades', t:'Atividades', txt:1 },
  { k:'observacoes',t:'Observações / justificativa stand-by', txt:1, obs:1 }
];
var ELABORADO_POR = 'Ryan Neves';      // aparecem no PDF, em cima de Atividades
var EXECUTADO_POR = 'Rebeca Bonner';
var CORES_PDF = { az: [219, 234, 254], lj: [253, 228, 200], cz: [231, 234, 238] };   // mesmas cores da tela
var PRIMEIRA_NUM = 5;      // 1ª coluna de horas (depois de Nome)
var MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

function avisoTopo(txt, tipo){
  var el = document.getElementById('avisoTopo');
  if(!txt){ el.removeAttribute('data-tipo'); el.textContent = ''; return; }
  el.textContent = txt; el.setAttribute('data-tipo', tipo || 'erro');
}
function horas(v){ return (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }
function dataCurta(iso){ var p = iso.split('-'); return p[2] + '/' + MESES[Number(p[1]) - 1]; }
function dataBr(iso){ var p = String(iso || '').split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : ''; }
function rotSemana(s){ return 'Semana ' + s.semana + ' / ' + s.ano + '  ·  ' + dataBr(s.ini).slice(0,5) + ' a ' + dataBr(s.fim).slice(0,5); }

function pedir(acao, dados){
  if(DEMO) return Promise.resolve(demo(acao, dados));
  return chamar(acao, dados);
}
function erroDe(err){ return traduzirErro(err) + (err && err.detalhe ? ' (' + err.detalhe + ')' : ''); }

/* ---------- filtros ---------- */
function carregarFiltros(){
  avisoTopo('');
  return pedir('tsNordexFiltros', {})
    .then(function(res){
      if(!res || !res.ok) throw { motivo: (res && res.motivo) || 'ERRO', detalhe: res && res.detalhe };
      var sp = document.getElementById('fParque'), sc = document.getElementById('fCliente');
      var parqueAntes = parqueAtual() ? parqueAtual().parque : lerPref('tsn_parque');
      var clienteAntes = sc.disabled ? lerPref('tsn_cliente') : sc.value;
      PARQUES = res.parques || [];
      if(!PARQUES.length){
        sc.innerHTML = '<option value="">—</option>';
        sp.innerHTML = '<option>Nenhum parque com RDO</option>';
        document.getElementById('painel').innerHTML = '<div class="vazio">Não há relatórios na planilha do RDO.</div>';
        return;
      }
      var clientes = [];
      PARQUES.forEach(function(p){ if(clientes.indexOf(p.cliente) < 0) clientes.push(p.cliente); });
      clientes.sort();
      sc.innerHTML = '<option value="">Todos os clientes</option>' + clientes.map(function(c){
        return '<option value="' + esc(c) + '">' + esc(c) + '</option>';
      }).join('');
      sc.value = clientes.indexOf(clienteAntes) > -1 ? clienteAntes : '';
      sc.disabled = false;
      montarParques(parqueAntes);
    })
    .catch(function(err){
      if(err && err.motivo === 'SESSAO') return;
      document.getElementById('painel').innerHTML = '';
      avisoTopo(erroDe(err));
    });
}

function parqueAtual(){
  var v = document.getElementById('fParque').value;
  return v === '' ? null : (PARQUES[Number(v)] || null);
}

/* Lista de parques do cliente escolhido (o valor da opção é o índice em PARQUES). */
function montarParques(preferido){
  var sp = document.getElementById('fParque'), cli = document.getElementById('fCliente').value;
  var idxs = [];
  PARQUES.forEach(function(p, i){ if(!cli || p.cliente === cli) idxs.push(i); });
  sp.innerHTML = idxs.map(function(i){
    var p = PARQUES[i];
    return '<option value="' + i + '">' + esc(p.parque) + (cli ? '' : ' — ' + esc(p.cliente)) + '</option>';
  }).join('');
  var achado = idxs.filter(function(i){ return PARQUES[i].parque === preferido; })[0];
  if(achado != null) sp.value = String(achado);
  sp.disabled = !idxs.length;
  gravarPref('tsn_cliente', cli);
  montarSemanas(true);
}

function montarSemanas(manterLembrada){
  var p = parqueAtual(), ss = document.getElementById('fSemana');
  if(!p){ ss.innerHTML = ''; ss.disabled = true; return; }
  var atual = ss.value || (manterLembrada ? lerPref('tsn_semana') : '');
  ss.innerHTML = p.semanas.map(function(s){
    var v = s.ano + '-' + s.semana;
    return '<option value="' + v + '">' + esc(rotSemana(s)) + '</option>';
  }).join('');
  if(atual && p.semanas.some(function(s){ return s.ano + '-' + s.semana === atual; })) ss.value = atual;
  ss.disabled = !p.semanas.length;
  carregarSemana();
}

function lerPref(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }
function gravarPref(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

/* ---------- semana ---------- */
function carregarSemana(){
  var p = parqueAtual(), v = document.getElementById('fSemana').value;
  if(!p || !v){ TS = null; desenhar(); return; }
  var a = v.split('-');
  gravarPref('tsn_parque', p.parque); gravarPref('tsn_semana', v);
  SEL = {}; ULTIMO_SEL = null;
  document.getElementById('painel').innerHTML = '<div class="carregando">Calculando a semana…</div>';
  document.getElementById('btPdf').disabled = true;
  pedir('tsNordexSemana', { parque: p.parque, ano: Number(a[0]), semana: Number(a[1]) })
    .then(function(res){
      if(!res || !res.ok) throw { motivo: (res && res.motivo) || 'ERRO', detalhe: res && res.detalhe };
      TS = res; desenhar();
    })
    .catch(function(err){
      if(err && err.motivo === 'SESSAO') return;
      TS = null; document.getElementById('painel').innerHTML = '';
      avisoTopo(erroDe(err));
    });
}

function valorCelula(d, c){
  if(c.k === 'data') return dataCurta(d.data);
  if(c.k === 'dia') return d.dia;
  if(c.k === 'feriado') return d.feriado ? 'SIM' : 'NÃO';
  if(!d.temRdo) return '';
  if(c.k === 'tecnicos') return String(d.tecnicos || '');
  if(c.k === 'nomes') return (d.nomes || []).join('\n');
  if(c.h) return horas(d[c.k]);
  return d[c.k] == null ? '' : String(d[c.k]);
}

function desenhar(){
  var painel = document.getElementById('painel');
  document.getElementById('btPdf').disabled = !TS;
  if(!TS){ painel.innerHTML = ''; return; }
  var c = TS.cab, nSel = Object.keys(SEL).length;

  var h = '<div class="ts-cab"><div class="ts-titulo">TIMESHEET HORAS TRABALHADAS - EXTREME WIND</div><div class="ts-info">' +
    '<div class="destaque"><span>Projeto / Parque</span><strong>' + esc(c.parque) + '</strong></div>' +
    '<div><span>Cliente</span><strong>' + esc(c.cliente) + '</strong></div>' +
    '<div class="destaque"><span>Semana (W)</span><strong>' + c.semana + '</strong></div>' +
    '<div><span>Ano</span><strong>' + c.ano + '</strong></div>' +
    '<div><span>Período</span><strong>' + dataBr(c.ini).slice(0,5) + ' a ' + dataBr(c.fim) + '</strong></div>' +
    '<div><span>Nº TS</span><strong>' + esc(c.numTs) + '</strong></div>' +
    '</div></div>';

  // A barra fica sempre no lugar (só os botões ligam/desligam) para a tabela
  // não pular quando a seleção começa.
  var bloq = (!nSel || SALVANDO) ? ' disabled' : '';
  h += '<div class="barra-fer"><span>' + (nSel
      ? '<strong>' + nSel + '</strong> dia(s) selecionado(s) na coluna Feriado'
      : 'Feriado: clique nas células da coluna <strong>FERIADO</strong> (Shift + clique pega um intervalo) e marque SIM ou NÃO. Feriado conta como 100%.') +
    '</span><span class="esp"></span>' +
    '<button class="btn btn--pequeno" type="button" data-fer="1"' + bloq + '>' + (SALVANDO ? 'Salvando…' : 'Marcar SIM') + '</button>' +
    '<button class="btn btn--pequeno btn--vazado" type="button" data-fer="0"' + bloq + '>Marcar NÃO</button>' +
    '<button class="btn btn--pequeno btn--vazado" type="button" id="btLimparSel"' + bloq + '>Limpar seleção</button></div>';

  h += '<div class="tabela-cx"><table class="ts"><thead><tr>' + COLUNAS.map(function(col){
    return '<th' + (col.sb ? ' class="sb"' : '') + '>' + esc(col.t) + '</th>';
  }).join('') + '</tr></thead><tbody>';

  TS.dias.forEach(function(d){
    var cls = (d.temRdo ? '' : 'sem-rdo ') + (d.tipo === '100%' ? 'dia-100' : '');
    h += '<tr class="' + cls + '">' + COLUNAS.map(function(col){
      var v = valorCelula(d, col);
      if(col.k === 'feriado'){
        return '<td class="fer' + (d.feriado ? ' sim' : '') + (SEL[d.data] ? ' sel' : '') + '" tabindex="0" role="button" aria-pressed="' + (SEL[d.data] ? 'true' : 'false') +
               '" data-data="' + d.data + '" title="Clique para selecionar">' + v + '</td>';
      }
      return '<td class="' + (col.k === 'dia' ? 'c-dia ' : '') + (col.txt ? 'txt ' : '') + (col.obs ? 'obs ' : '') + (col.nome ? 'nome ' : '') + (col.cor ? 'cor-' + col.cor : '') + '">' + esc(v).replace(/\n/g, '<br>') + '</td>';
    }).join('') + '</tr>';
  });

  var t = TS.totais;
  h += linhaTotal('tot', 'TOTAL POR TÉCNICO (h)', t.porTecnico, false);
  h += linhaTotal('geral', 'TOTAL GERAL – TODOS OS TÉCNICOS (h)', t.geral, true, t.porTecnico.tecnicos);
  h += '</tbody></table></div>';
  h += '<div class="rodape-ts">Dados da planilha do RDO (abas Relatorios, Atividades e Aux_Analise). Jornada normal seg–sex até ' +
       horas(c.limite) + ' h; almoço descontado: ' + horas(c.almoco) + ' h.</div>';
  painel.innerHTML = h;
}

function linhaTotal(cls, rotulo, v, geral, nTec){
  var h = '<tr class="' + cls + '"><td class="rot" colspan="' + (geral ? 3 : 5) + '">' + esc(rotulo) + '</td>';
  if(geral) h += '<td>' + (nTec || 0) + '</td><td></td>';
  COLUNAS.slice(PRIMEIRA_NUM).forEach(function(col){ h += '<td>' + (col.h ? horas(v[col.k]) : '') + '</td>'; });
  return h + '</tr>';
}

/* ---------- feriado: seleção e gravação ---------- */
document.getElementById('painel').addEventListener('click', function(ev){
  var td = ev.target.closest('td.fer');
  if(td){ alternarSel(td.getAttribute('data-data'), ev.shiftKey); return; }
  var bt = ev.target.closest('[data-fer]');
  if(bt){ salvarFeriado(bt.getAttribute('data-fer') === '1'); return; }
  if(ev.target.id === 'btLimparSel'){ SEL = {}; ULTIMO_SEL = null; desenhar(); }
});
document.getElementById('painel').addEventListener('keydown', function(ev){
  var td = ev.target.closest('td.fer');
  if(td && (ev.key === 'Enter' || ev.key === ' ')){ ev.preventDefault(); alternarSel(td.getAttribute('data-data'), ev.shiftKey); focarFer(td.getAttribute('data-data')); }
});
function focarFer(data){ var el = document.querySelector('td.fer[data-data="' + data + '"]'); if(el) el.focus(); }

function alternarSel(data, intervalo){
  if(SALVANDO) return;
  if(intervalo && ULTIMO_SEL){
    var datas = TS.dias.map(function(d){ return d.data; });
    var a = datas.indexOf(ULTIMO_SEL), b = datas.indexOf(data);
    if(a > b){ var x = a; a = b; b = x; }
    for(var i = a; i <= b; i++) SEL[datas[i]] = true;
  } else if(SEL[data]) delete SEL[data];
  else SEL[data] = true;
  ULTIMO_SEL = data;
  desenhar();
}

function salvarFeriado(sim){
  var datas = Object.keys(SEL).sort();
  if(!datas.length || !TS) return;
  SALVANDO = true; desenhar();
  pedir('tsNordexFeriado', { parque: TS.cab.parque, ano: TS.cab.ano, semana: TS.cab.semana, datas: datas, feriado: sim })
    .then(function(res){
      if(!res || !res.ok) throw { motivo: (res && res.motivo) || 'ERRO', detalhe: res && res.detalhe };
      TS = res; SEL = {}; ULTIMO_SEL = null;
      recado(datas.length + ' dia(s) marcado(s) como ' + (sim ? 'feriado' : 'não feriado') + '.', 'ok');
    })
    .catch(function(err){
      if(err && err.motivo === 'SESSAO') return;
      recado(erroDe(err), 'erro');
    })
    .then(function(){ SALVANDO = false; desenhar(); });
}

/* ---------- PDF (jsPDF + AutoTable, baixados só no 1º clique) ---------- */
var LIBS_PDF = [
  'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'
];
function carregarScript(src){
  return new Promise(function(ok, falha){
    if(document.querySelector('script[src="' + src + '"]')) return ok();
    var s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = function(){ falha(new Error('não carregou ' + src)); };
    document.head.appendChild(s);
  });
}
function txtPdf(t){ return String(t == null ? '' : t).replace(/[—–]/g, '-').replace(/[^\x00-\xFF]/g, ''); }

function baixarPdf(){
  if(!TS) return;
  var bt = document.getElementById('btPdf');
  bt.disabled = true;
  carregarScript(LIBS_PDF[0])
    .then(function(){ return carregarScript(LIBS_PDF[1]); })
    .then(function(){
      var c = TS.cab;
      var nome = 'Timesheet ' + c.parque + ' W' + ('0' + c.semana).slice(-2) + ' ' + c.ano + '.pdf';
      gerarPdf().save(nome.replace(/[\\/:*?"<>|]/g, '-'));
    })
    .catch(function(e){ recado('Não consegui gerar o PDF: ' + e.message, 'erro'); })
    .then(function(){ bt.disabled = false; });
}

function gerarPdf(){
  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  var W = doc.internal.pageSize.getWidth(), M = 8;
  var NAVY = [28, 53, 87], SB = [43, 76, 126], CLARO = [220, 230, 242];
  var c = TS.cab;

  doc.setFillColor.apply(doc, NAVY); doc.rect(M, M, W - 2 * M, 10, 'F');
  doc.setTextColor(255); doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
  doc.text('TIMESHEET HORAS TRABALHADAS - EXTREME WIND', W / 2, M + 6.8, { align: 'center' });

  var info = [['PROJETO / PARQUE:', c.parque, 'CLIENTE:', c.cliente],
              ['SEMANA (W):', String(c.semana), 'ANO:', String(c.ano)],
              ['Nº TS:', c.numTs, 'PERÍODO:', dataBr(c.ini) + ' a ' + dataBr(c.fim)]];
  doc.autoTable({
    startY: M + 12, margin: { left: M, right: M }, tableWidth: 150, theme: 'grid',
    body: info.map(function(l){ return l.map(txtPdf); }),
    styles: { fontSize: 8, cellPadding: 1.4, lineColor: [160, 175, 195], lineWidth: 0.2, textColor: [14, 32, 51] },
    columnStyles: { 0: { fontStyle: 'bold', fillColor: CLARO, cellWidth: 32, halign: 'right' }, 1: { cellWidth: 48, textColor: [20, 70, 160], fontStyle: 'bold' },
                    2: { fontStyle: 'bold', fillColor: CLARO, cellWidth: 22, halign: 'right' }, 3: { cellWidth: 48 } }
  });

  var corpo = TS.dias.map(function(d){
    return COLUNAS.map(function(col){ return txtPdf(valorCelula(d, col)); });
  });
  var t = TS.totais;
  var linhaTot = [{ content: 'TOTAL POR TÉCNICO (h)', colSpan: PRIMEIRA_NUM }];
  var linhaGer = [{ content: txtPdf('TOTAL GERAL - TODOS OS TÉCNICOS (h)'), colSpan: 3 }, String(t.porTecnico.tecnicos || 0), ''];
  COLUNAS.slice(PRIMEIRA_NUM).forEach(function(col){
    linhaTot.push(col.h ? horas(t.porTecnico[col.k]) : '');
    linhaGer.push(col.h ? horas(t.geral[col.k]) : '');
  });

  var larg = [11, 16, 9, 9, 32, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 11, 12, 11, 20, 25, 0];
  var usado = larg.reduce(function(a, b){ return a + b; }, 0);
  larg[20] = Math.max(22, W - 2 * M - usado);
  // Em cima de Atividades / Observações (espaço livre ao lado do quadro de cima)
  var xAtiv = M + larg.slice(0, 19).reduce(function(a, b){ return a + b; }, 0);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(14, 32, 51);
  doc.text(txtPdf('Elaborado por: ' + ELABORADO_POR), xAtiv, M + 17);
  doc.text(txtPdf('Executado por: ' + EXECUTADO_POR), xAtiv, M + 22.5);

  var colStyles = {};
  larg.forEach(function(w, i){ colStyles[i] = { cellWidth: w, halign: COLUNAS[i].txt ? 'left' : 'center' }; });

  doc.autoTable({
    startY: doc.lastAutoTable.finalY + 4, margin: { left: M, right: M }, theme: 'grid',
    head: [COLUNAS.map(function(col){ return txtPdf(col.t.toUpperCase()); })],
    body: corpo, foot: [linhaTot, linhaGer], showFoot: 'lastPage',
    styles: { fontSize: 6, cellPadding: 1, lineColor: [170, 185, 205], lineWidth: 0.2, textColor: [14, 32, 51], valign: 'middle', overflow: 'linebreak' },
    headStyles: { fillColor: NAVY, textColor: 255, fontSize: 5.2, halign: 'center', valign: 'middle', fontStyle: 'bold' },
    footStyles: { fontStyle: 'bold', halign: 'center' },
    columnStyles: colStyles,
    didParseCell: function(h){
      if(h.section === 'head' && COLUNAS[h.column.index] && COLUNAS[h.column.index].sb) h.cell.styles.fillColor = SB;
      if(h.section === 'foot'){
        var ger = h.row.index === 1;
        h.cell.styles.fillColor = ger ? NAVY : CLARO;
        h.cell.styles.textColor = ger ? 255 : [14, 32, 51];
        if(h.column.index === 0) h.cell.styles.halign = 'right';
      }
      if(h.section === 'body'){
        var d = TS.dias[h.row.index];
        var cor = COLUNAS[h.column.index] && CORES_PDF[COLUNAS[h.column.index].cor];
        if(cor) h.cell.styles.fillColor = cor;
        if(h.column.index === 2 && d.feriado){ h.cell.styles.textColor = [176, 42, 30]; h.cell.styles.fontStyle = 'bold'; }
        if(h.column.index === 1 && d.tipo === '100%'){ h.cell.styles.textColor = [176, 42, 30]; h.cell.styles.fontStyle = 'bold'; }
      }
    }
  });

  var y = doc.lastAutoTable.finalY + 5;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(7); doc.setTextColor(110);
  doc.text(txtPdf('Gerado pelo Portal Administrativo em ' + new Date().toLocaleString('pt-BR') +
           '. Jornada normal seg-sex até ' + horas(c.limite) + ' h; almoço descontado: ' + horas(c.almoco) + ' h. Domingo e feriado = 100%.'), M, y);
  assinaturaPdf(doc, y + 4, M);
  return doc;
}

/* Linha de assinatura centralizada, embaixo da tabela (vai para outra folha se não couber). */
function assinaturaPdf(doc, y, M){
  var W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  var larg = 95, alto = 20;
  if(y + alto > H - M){ doc.addPage(); y = M + 10; }
  var linhaY = y + 12, x0 = (W - larg) / 2;
  doc.setDrawColor(40); doc.setLineWidth(0.3);
  doc.line(x0, linhaY, x0 + larg, linhaY);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(30);
  doc.text(txtPdf('ASSINATURA VALIDAÇÃO'), W / 2, linhaY + 4.5, { align: 'center' });
}

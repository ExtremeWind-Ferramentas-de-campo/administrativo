<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script src="../guard.js"></script>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2b7fd0">
<title>Meus Dados | Extreme Wind</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --ink:#0e2033; --muted:#4f6273;
    --panel:rgba(255,255,255,.82); --panel-border:rgba(255,255,255,.65);
    --card:#ffffff; --card-line:#e2e8f0;
    --bg-1:#6db3ef; --bg-2:#eaf6ff;
    --ff:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    --shadow:0 18px 50px rgba(9,34,64,.18);
  }
  :root[data-theme="dark"]{
    --ink:#e8eff8; --muted:#9fb2c6;
    --panel:rgba(15,29,48,.74); --panel-border:rgba(120,150,185,.22);
    --card:#0f1d2e; --card-line:#2a3c52;
    --bg-1:#081525; --bg-2:#173251;
    --shadow:0 18px 50px rgba(0,0,0,.5);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ink:#e8eff8; --muted:#9fb2c6;
      --panel:rgba(15,29,48,.74); --panel-border:rgba(120,150,185,.22);
      --card:#0f1d2e; --card-line:#2a3c52;
      --bg-1:#081525; --bg-2:#173251;
      --shadow:0 18px 50px rgba(0,0,0,.5);
    }
  }
  body{font-family:var(--ff);color:var(--ink);min-height:100vh;
    background:linear-gradient(180deg,var(--bg-1),var(--bg-2));
    display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
  .topo{display:flex;align-items:center;gap:12px;padding:16px 16px 0;max-width:820px;
    width:100%;margin:0 auto}
  .nav-back-link{width:40px;height:40px;flex-shrink:0;border-radius:12px;display:grid;place-items:center;
    border:1px solid var(--panel-border);background:var(--panel);color:var(--ink);text-decoration:none;
    box-shadow:var(--shadow)}
  .topo h1{flex:1;text-align:center;font-size:clamp(1.3rem,4vw,1.8rem);font-weight:800;letter-spacing:-.5px}
  .topo .espaco{width:40px;flex-shrink:0}
  main{flex:1;width:100%;max-width:820px;margin:0 auto;padding:22px 16px 24px;
    display:flex;flex-direction:column;gap:18px}
  .sessao{text-align:center;font-size:.82rem;color:var(--muted);font-weight:600}
  .picker{background:var(--panel);border:1px solid var(--panel-border);border-radius:24px;
    padding:22px 18px 24px;box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .picker h2{font-size:1.05rem;font-weight:700;margin-bottom:18px;text-align:center}
  .apps{display:grid;grid-template-columns:1fr;gap:14px}
  .app-card{background:var(--card);border:1px solid var(--card-line);border-top:5px solid var(--c);
    border-radius:20px;padding:22px 18px;text-decoration:none;color:var(--ink);
    display:flex;align-items:center;gap:16px;box-shadow:0 6px 18px rgba(9,34,64,.10);
    transition:transform .18s ease,box-shadow .18s ease}
  .app-card:hover,.app-card:focus-visible{transform:translateY(-4px);box-shadow:0 16px 34px rgba(9,34,64,.22);outline:none}
  .app-card .ico{width:58px;height:58px;flex-shrink:0;border-radius:18px;display:grid;place-items:center;
    color:#fff;font-size:1.5rem;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#fff))}
  .app-card .txt{display:flex;flex-direction:column;gap:4px;flex:1}
  .app-title{font-size:1.1rem;font-weight:800;line-height:1.2}
  .app-desc{font-size:.85rem;color:var(--muted);line-height:1.35}
  .app-card .go{font-size:.85rem;font-weight:700;color:var(--c);display:flex;align-items:center;gap:6px}
  footer{text-align:center;color:var(--muted);font-size:.78rem;padding:14px 16px 18px}
  @media(prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>
</head>
<body>

<div class="topo">
  <a class="nav-back-link" href="../index.html" title="Voltar"><i class="fas fa-arrow-left"></i></a>
  <h1>Meus Dados</h1>
  <span class="espaco" aria-hidden="true"></span>
</div>

<main>
  <div class="sessao" id="sessaoNome"></div>

  <section class="picker">
    <h2>O que você quer consultar?</h2>
    <div class="apps">
      <a class="app-card" href="pe-de-meia.html" style="--c:#0e7c7b">
        <span class="ico"><i class="fas fa-piggy-bank"></i></span>
        <span class="txt">
          <span class="app-title">Pé de meia</span>
          <span class="app-desc">Valores guardados na sua conta</span>
        </span>
        <span class="go">Abrir <i class="fas fa-arrow-right"></i></span>
      </a>
      <a class="app-card" href="cursos.html" style="--c:#6a4bb8">
        <span class="ico"><i class="fas fa-graduation-cap"></i></span>
        <span class="txt">
          <span class="app-title">Cursos</span>
          <span class="app-desc">Descontos de cursos e saldo devedor</span>
        </span>
        <span class="go">Abrir <i class="fas fa-arrow-right"></i></span>
      </a>
      <a class="app-card" href="dividas.html" style="--c:#c26a12">
        <span class="ico"><i class="fas fa-file-invoice-dollar"></i></span>
        <span class="txt">
          <span class="app-title">Dívidas</span>
          <span class="app-desc">Valores em aberto no seu nome</span>
        </span>
        <span class="go">Abrir <i class="fas fa-arrow-right"></i></span>
      </a>
      <a class="app-card" href="equipamentos.html" style="--c:#2e7d4f">
        <span class="ico"><i class="fas fa-toolbox"></i></span>
        <span class="txt">
          <span class="app-title">Meus Equipamentos</span>
          <span class="app-desc">Ferramentas e EPIs no seu nome</span>
        </span>
        <span class="go">Abrir <i class="fas fa-arrow-right"></i></span>
      </a>
    </div>
  </section>
</main>

<footer>Extreme Wind Blade Services &copy; <span id="year"></span> · Uso interno</footer>

<script>
'use strict';
document.getElementById('year').textContent = new Date().getFullYear();

/* tema — mesma chave do menu, pra não piscar branco quem usa escuro */
(function(){
  var t = localStorage.getItem('ew_theme');
  if(t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
})();

(function(){
  try{
    var s = JSON.parse(localStorage.getItem('ew_sessao') || 'null');
    if(s) document.getElementById('sessaoNome').textContent = s.nome + ' · mat. ' + s.mat;
  }catch(_){}
})();
</script>
<script src="../cenario.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script src="../guard.js"></script>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://script.google.com https://script.googleusercontent.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data: blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2b7fd0">
<title>Meus Equipamentos | Extreme Wind</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../icon-192.png">

<meta name="mobile-web-app-capable" content="yes">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --ink:#0e2033; --muted:#4f6273;
    --panel:rgba(255,255,255,.82); --panel-border:rgba(255,255,255,.65);
    --card:#ffffff; --card-line:#e2e8f0;
    --bg-1:#6db3ef; --bg-2:#eaf6ff;
    --cor:#2e7d4f; --cor-forte:#1f5a37;
    --ff:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    --shadow:0 18px 50px rgba(9,34,64,.18);
  }
  :root[data-theme="dark"]{
    --ink:#e8eff8; --muted:#9fb2c6;
    --panel:rgba(15,29,48,.74); --panel-border:rgba(120,150,185,.22);
    --card:#0f1d2e; --card-line:#2a3c52;
    --bg-1:#081525; --bg-2:#173251;
    --cor:#5cc088; --cor-forte:#5cc088;
    --shadow:0 18px 50px rgba(0,0,0,.5);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ink:#e8eff8; --muted:#9fb2c6;
      --panel:rgba(15,29,48,.74); --panel-border:rgba(120,150,185,.22);
      --card:#0f1d2e; --card-line:#2a3c52;
      --bg-1:#081525; --bg-2:#173251;
      --cor:#5cc088; --cor-forte:#5cc088;
      --shadow:0 18px 50px rgba(0,0,0,.5);
    }
  }
  body{font-family:var(--ff);color:var(--ink);min-height:100vh;
    background:linear-gradient(180deg,var(--bg-1),var(--bg-2));
    display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
  .topo{display:flex;align-items:center;gap:12px;padding:16px 16px 0;max-width:640px;width:100%;margin:0 auto}
  .nav-back-link{width:40px;height:40px;flex-shrink:0;border-radius:12px;display:grid;place-items:center;
    border:1px solid var(--panel-border);background:var(--panel);color:var(--ink);text-decoration:none;
    box-shadow:var(--shadow)}
  .topo h1{flex:1;text-align:center;font-size:clamp(1.3rem,4vw,1.8rem);font-weight:800;letter-spacing:-.5px}
  .btn-olho{width:40px;height:40px;flex-shrink:0;border-radius:12px;cursor:pointer;
    border:1px solid var(--panel-border);background:var(--panel);color:var(--ink);
    box-shadow:var(--shadow);font-size:.95rem}
  main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:20px 16px 24px;
    display:flex;flex-direction:column;gap:16px}
  .sessao{text-align:center;font-size:.82rem;color:var(--muted);font-weight:600}

  .painel{background:var(--panel);border:1px solid var(--panel-border);border-radius:24px;
    padding:20px 16px 22px;box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

  .estado{text-align:center;padding:26px 12px;color:var(--muted);font-weight:600;font-size:.95rem;line-height:1.5}
  .estado i{display:block;font-size:2rem;margin-bottom:12px;color:var(--cor)}
  .estado.erro i{color:#b02a1e}
  .estado.vazio i{color:var(--muted)}

  .itens{display:flex;flex-direction:column;gap:14px}
  .item{background:var(--card);border:1px solid var(--card-line);border-top:5px solid var(--cor);
    border-radius:18px;padding:14px 16px 12px}
  .item h3{font-size:1rem;font-weight:800;line-height:1.3;margin-bottom:10px;
    display:flex;align-items:flex-start;gap:8px}
  .item h3 i{color:var(--cor);font-size:.9rem;margin-top:3px;flex-shrink:0}
  .item .num{margin-left:auto;font-size:.72rem;font-weight:700;color:var(--muted);
    background:var(--panel-border);border-radius:8px;padding:2px 8px;flex-shrink:0}
  .linha{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:8px 0;border-top:1px solid var(--card-line)}
  .linha .rot{font-size:.84rem;font-weight:700;color:var(--muted)}
  .linha .val{font-size:1rem;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
  .linha.destaque .rot{color:var(--cor-forte);font-size:.9rem}
  .linha.destaque .val{font-size:1.25rem;color:var(--cor-forte)}
  .linha.quitado .val{color:#15803d}

  .item.total{border-top-color:var(--cor);border:2px solid var(--cor);
    background:color-mix(in srgb,var(--cor) 8%,var(--card))}
  .item.total h3{color:var(--cor-forte)}
  body.oculto .val{filter:blur(9px);user-select:none}

  .atualizado{margin-top:16px;text-align:center;font-size:.82rem;color:var(--muted);
    font-weight:600;line-height:1.6;border-top:1px dashed var(--card-line);padding-top:14px}
  .atualizado strong{display:block;font-size:1rem;color:var(--ink);font-weight:800;margin-top:2px}

  .btn-recarregar{width:100%;min-height:48px;border:none;border-radius:14px;cursor:pointer;
    font-family:inherit;font-size:.95rem;font-weight:800;color:#fff;background:var(--cor);
    box-shadow:0 6px 18px rgba(9,34,64,.22);display:flex;align-items:center;justify-content:center;gap:8px}
  .btn-recarregar:active{filter:brightness(.94)}
  .btn-recarregar:disabled{opacity:.6;cursor:default}

  .espaco{width:40px;flex-shrink:0}
  .painel{padding:18px 14px 20px}

  .tec{display:flex;align-items:center;gap:12px;padding-bottom:14px;margin-bottom:12px;border-bottom:1px solid var(--card-line)}
  .tec-av{width:46px;height:46px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
    background:var(--cor);color:#fff;font-weight:800;font-size:1rem;letter-spacing:.5px}
  .tec-info{flex:1;min-width:0}
  .tec-nome{font-weight:800;font-size:.98rem;line-height:1.25}
  .tec-mat{font-size:.8rem;color:var(--muted);font-weight:600;margin-top:2px}
  .tec-qt{text-align:right;font-size:1.6rem;font-weight:800;color:var(--cor-forte);line-height:1;font-variant-numeric:tabular-nums}
  .tec-qt span{display:block;font-size:.7rem;font-weight:700;color:var(--muted);margin-top:3px}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--card-line);margin-bottom:12px}
  .tab-btn{flex:1;background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;
    font-family:inherit;font-size:.86rem;font-weight:800;color:var(--muted);padding:10px 6px 9px;
    display:flex;align-items:center;justify-content:center;gap:6px}
  .tab-btn.ativo{color:var(--cor-forte);border-bottom-color:var(--cor)}
  .tab-badge{background:#b3261e;color:#fff;border-radius:10px;font-size:.7rem;padding:1px 7px}

  .barra{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-bottom:10px}
  .pdf-status{font-size:.78rem;color:var(--muted);font-weight:600}
  .pdf-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--cor);color:var(--cor-forte);
    background:var(--card);border-radius:10px;padding:8px 12px;font-family:inherit;font-weight:800;font-size:.82rem;cursor:pointer}
  .pdf-btn:disabled{opacity:.6;cursor:default}

  .tabela{border:1px solid var(--card-line);border-radius:14px;overflow-x:auto;background:var(--card)}
  table{width:100%;border-collapse:collapse;font-size:.76rem;table-layout:fixed}
  col.k-id{width:10%} col.k-qtd{width:10%} col.k-loc{width:22%} col.k-data{width:23%}
  th{background:var(--cor);color:#fff;text-align:left;font-weight:800;padding:8px 3px;font-size:.58rem;line-height:1.2;letter-spacing:-.1px}
  td{padding:7px 5px;border-top:1px solid var(--card-line);vertical-align:top;overflow-wrap:break-word}
  tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--cor) 5%,var(--card))}
  .c-id,.c-qtd,.c-data{font-variant-numeric:tabular-nums}
  .c-data{white-space:nowrap;font-size:.72rem}
  .c-id{white-space:nowrap;font-size:.72rem}
  .c-id{color:var(--muted)}
  .c-qtd{text-align:center;font-weight:800}
  .c-desc{font-weight:700}
  .c-loc,.c-data{color:var(--muted)}

  .ext-lista{display:flex;flex-direction:column;gap:10px}
  .ext{background:var(--card);border:1px solid var(--card-line);border-left:5px solid #b3261e;border-radius:14px;padding:12px 14px}
  .ext-topo{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .ext-item{font-weight:800;font-size:.92rem;line-height:1.3}
  .badge{font-size:.7rem;font-weight:800;border-radius:8px;padding:3px 8px;white-space:nowrap}
  .badge-sim{background:#fdecec;color:#b3261e}
  .badge-nao{background:color-mix(in srgb,var(--cor) 14%,var(--card));color:var(--cor-forte)}
  .ext-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .ext-meta span{font-size:.75rem;font-weight:700;color:var(--muted);background:var(--panel-border);border-radius:8px;padding:2px 8px}
  .ext-obs{margin-top:8px;font-size:.8rem;line-height:1.45;color:var(--ink)}
  .ext-anexo{margin-top:8px;font-size:.8rem;font-weight:700}
  .ext-anexo a{color:var(--cor-forte)}
  .ext-anexo .sem{color:var(--muted);font-weight:600}
  .ext-fonte{margin-top:12px;text-align:center;font-size:.75rem;color:var(--muted);font-weight:600}
  .vazio-aba{text-align:center;color:var(--muted);font-weight:600;padding:22px 8px;font-size:.9rem}
  .nota{font-size:.75rem;color:var(--muted);text-align:center;line-height:1.5}
  footer{text-align:center;color:var(--muted);font-size:.78rem;padding:8px 16px 18px}
  .girando{animation:gira 1s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>

<div class="topo">
  <a class="nav-back-link" href="index.html" title="Voltar"><i class="fas fa-arrow-left"></i></a>
  <h1>Meus Equipamentos</h1>
  <span class="espaco" aria-hidden="true"></span>
</div>

<main>
  <div class="sessao" id="sessaoNome"></div>

  <section class="painel">
    <div id="conteudo">
      <div class="estado"><i class="fas fa-circle-notch girando"></i>Consultando…</div>
    </div>
    <div class="atualizado" id="blocoData" hidden>
      <span>Planilha do almoxarifado salva em:</span>
      <strong id="dataAtualizacao">—</strong>
    </div>
  </section>

  <button type="button" class="btn-recarregar" id="btnRecarregar">
    <i class="fas fa-rotate"></i> Atualizar
  </button>

  <p class="nota">Algum item errado ou faltando? Fale com o almoxarifado — esta tela é só consulta.
    Mudanças na planilha podem levar até 15 minutos para aparecer aqui.</p>
</main>

<footer>Extreme Wind Blade Services &copy; <span id="year"></span> · Uso interno</footer>

<script>
'use strict';
document.getElementById('year').textContent = new Date().getFullYear();

(function(){
  var t = localStorage.getItem('ew_theme');
  if(t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
})();

(function(){

/* Mesmo Apps Script do login e do RDO. Se trocar o endereco la, troque aqui. */
const ENDPOINT = "https://script.google.com/macros/s/AKfycbxoOpV339g76UpYa7sO28C6lS99TAz7po2c0dNAk0i1X1HgsyKC_KXIuuBAS7qbBzLG/exec";
const SESSAO_LS_KEY = 'ew_sessao';
const ACAO = 'meusEquipamentos';

const elConteudo = document.getElementById('conteudo');
const elBlocoData = document.getElementById('blocoData');
const elData = document.getElementById('dataAtualizacao');
const btnRecarregar = document.getElementById('btnRecarregar');
let ATUAL = null;

function sessao(){
  try{
    const s = JSON.parse(localStorage.getItem(SESSAO_LS_KEY) || 'null');
    if(!s || !s.token || !s.exp || s.exp <= Date.now()) return null;
    return s;
  }catch(_){ return null; }
}

const s = sessao();
if(s) document.getElementById('sessaoNome').textContent = s.nome + ' \u00b7 mat. ' + s.mat;

function pedirJsonp(token){
  return new Promise(resolve=>{
    const cb = '__eqCb' + Date.now();
    let pronto = false;
    window[cb] = j => { pronto = true; resolve(j); try{ delete window[cb]; }catch(_){ window[cb]=null; } };
    const sc = document.createElement('script');
    sc.src = ENDPOINT + (ENDPOINT.indexOf('?')>=0?'&':'?')
           + 'acao=' + ACAO + '&token=' + encodeURIComponent(token) + '&callback=' + cb;
    sc.onerror = ()=>{ if(!pronto) resolve(null); };
    document.head.appendChild(sc);
    setTimeout(()=>{ if(!pronto) resolve(null); }, 45000);
  });
}

function esc(t){
  return String(t==null?'':t).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function iniciais(nome){
  const p = String(nome||'').trim().split(/\s+/).filter(Boolean);
  return ((p[0]||'')[0]||'') + (p.length > 1 ? (p[p.length-1][0]||'') : '');
}

function mostrarEstado(icone, texto, classe){
  elConteudo.innerHTML = '<div class="estado ' + (classe||'') + '">'
    + '<i class="fas ' + icone + '"></i>' + texto + '</div>';
}

function painelEquipamentos(itens){
  if(!itens.length){
    return '<div class="vazio-aba">Nenhum equipamento registrado no seu nome no momento.</div>';
  }
  const linhas = itens.map(e =>
      '<tr><td class="c-id">' + esc(e.id||'\u2014') + '</td>'
    + '<td class="c-desc">' + esc(e.descricao||'\u2014') + '</td>'
    + '<td class="c-qtd">' + (e.qtd||1) + '</td>'
    + '<td class="c-loc">' + esc(e.localizacao||'\u2014') + '</td>'
    + '<td class="c-data">' + esc(e.dataSaida||'\u2014') + '</td></tr>').join('');
  return '<div class="barra"><span class="pdf-status" id="pdfStatus" aria-live="polite"></span>'
       + '<button type="button" class="pdf-btn" id="pdfBtn"><i class="fas fa-file-arrow-down"></i> Baixar PDF</button></div>'
       + '<div class="tabela"><table><colgroup><col class="k-id"><col><col class="k-qtd"><col class="k-loc"><col class="k-data"></colgroup><thead><tr>'
       + '<th>ID</th><th>DESCRI\u00c7\u00c3O</th><th>QTD</th><th>LOCALIZA\u00c7\u00c3O</th><th>DATA DE SA\u00cdDA</th>'
       + '</tr></thead><tbody>' + linhas + '</tbody></table></div>';
}

function painelExtravio(lista){
  if(!lista.length){
    return '<div class="vazio-aba">Nenhum registro de material extraviado ou avariado no seu nome.</div>';
  }
  return '<div class="ext-lista">' + lista.map(o => {
    const badge = o.descontado === true  ? '<span class="badge badge-sim">Descontado</span>'
                : o.descontado === false ? '<span class="badge badge-nao">N\u00e3o descontado</span>' : '';
    const anexo = o.linkRelatorio
      ? '<a href="' + esc(o.linkRelatorio) + '" target="_blank" rel="noopener">Ver relat\u00f3rio de desmobiliza\u00e7\u00e3o</a>'
      : '<span class="sem">Relat\u00f3rio n\u00e3o anexado</span>';
    return '<div class="ext">'
      + '<div class="ext-topo"><span class="ext-item">' + esc(o.descricao||'\u2014') + '</span>' + badge + '</div>'
      + '<div class="ext-meta">'
        + (o.valor ? '<span>' + esc(o.valor) + '</span>' : '')
        + (o.projeto ? '<span>' + esc(o.projeto) + '</span>' : '')
        + (o.mes ? '<span>' + esc(o.mes) + '</span>' : '')
      + '</div>'
      + (o.ocorrencia ? '<div class="ext-obs">' + esc(o.ocorrencia) + '</div>' : '')
      + '<div class="ext-anexo">' + anexo + '</div>'
      + '</div>';
  }).join('') + '</div>';
}

function mostrar(r){
  const itens = r.itens || [], ext = r.extravios || [];
  const unidades = itens.reduce((a, e) => a + (e.qtd||1), 0);
  elConteudo.innerHTML =
      '<div class="tec"><div class="tec-av">' + esc(iniciais(r.nome)) + '</div>'
    + '<div class="tec-info"><div class="tec-nome">' + esc(r.nome) + '</div><div class="tec-mat">Matr\u00edcula ' + esc(r.mat) + '</div></div>'
    + '<div class="tec-qt">' + unidades + '<span>' + (unidades===1?'unidade':'unidades') + '</span></div></div>'
    + '<div class="tabs" role="tablist">'
    +   '<button type="button" class="tab-btn ativo" data-aba="eq" role="tab" aria-selected="true">Meus Equipamentos</button>'
    +   '<button type="button" class="tab-btn" data-aba="ext" role="tab" aria-selected="false">Extraviados e Avariados'
    +     (ext.length ? ' <span class="tab-badge">' + ext.length + '</span>' : '') + '</button>'
    + '</div>'
    + '<div id="abaEq">' + painelEquipamentos(itens) + '</div>'
    + '<div id="abaExt" hidden>' + painelExtravio(ext)
    +   (r.extravioAtualizadoEm ? '<p class="ext-fonte">Lista de extravios e descontos salva em ' + esc(r.extravioAtualizadoEm) + '</p>' : '')
    + '</div>';
}

elConteudo.addEventListener('click', e => {
  const tb = e.target.closest('.tab-btn');
  if(tb){
    const aba = tb.getAttribute('data-aba');
    elConteudo.querySelectorAll('.tab-btn').forEach(b => {
      const at = b === tb; b.classList.toggle('ativo', at); b.setAttribute('aria-selected', at ? 'true' : 'false');
    });
    document.getElementById('abaEq').hidden = aba !== 'eq';
    document.getElementById('abaExt').hidden = aba !== 'ext';
  }
  if(e.target.closest('#pdfBtn')) baixarPdf();
});

/* ---------- PDF (mesmo layout do modelo do almoxarifado) ---------- */
function pdfStatus(msg, erro){
  const el = document.getElementById('pdfStatus');
  if(el){ el.textContent = msg; el.style.color = erro ? '#b3261e' : ''; }
}

function baixarPdf(){
  if(!ATUAL) return;
  const jsPDF = window.jspdf && window.jspdf.jsPDF;
  const btn = document.getElementById('pdfBtn');
  if(!jsPDF){ pdfStatus('Gerador de PDF n\u00e3o carregou. Confira a internet e toque em Atualizar.', true); return; }
  btn.disabled = true; pdfStatus('Gerando\u2026');
  try{
    const itens = ATUAL.itens || [];
    const unidades = itens.reduce((a, e) => a + (e.qtd||1), 0);
    const doc = new jsPDF({ unit:'pt', format:'a4' });
    doc.setFont('helvetica','bold'); doc.setFontSize(14);
    doc.text('Meus Equipamentos', 40, 40);
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90,90,90);
    doc.text(ATUAL.nome + '  \u00b7  Matr\u00edcula ' + ATUAL.mat, 40, 58);
    doc.text(unidades + ' unidade(s) em ' + itens.length + ' item(ns)'
      + (ATUAL.atualizadoEm ? '  \u00b7  planilha salva em ' + ATUAL.atualizadoEm : ''), 40, 72);
    doc.setTextColor(0,0,0);
    doc.autoTable({
      startY: 86,
      head: [['ID','Descri\u00e7\u00e3o','Qtd','Localiza\u00e7\u00e3o','Data de sa\u00edda']],
      body: itens.map(e => [e.id||'\u2014', e.descricao||'\u2014', String(e.qtd||1), e.localizacao||'\u2014', e.dataSaida||'\u2014']),
      styles:{ font:'helvetica', fontSize:9, cellPadding:5, valign:'middle' },
      headStyles:{ fillColor:[5,83,133], textColor:255, fontStyle:'bold' },
      alternateRowStyles:{ fillColor:[245,247,249] },
      columnStyles:{ 0:{ cellWidth:36 }, 2:{ cellWidth:32, halign:'center' }, 4:{ cellWidth:70 } },
      margin:{ left:40, right:40 }
    });
    const url = URL.createObjectURL(doc.output('blob'));
    const a = document.createElement('a');
    a.href = url; a.download = 'equipamentos-' + ATUAL.mat + '.pdf';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    pdfStatus('PDF salvo.');
  }catch(err){
    console.error(err); pdfStatus('N\u00e3o deu para gerar o PDF agora.', true);
  }finally{ btn.disabled = false; }
}

function paraOLogin(){
  try{ localStorage.removeItem(SESSAO_LS_KEY); }catch(_){}
  location.replace('../index.html');
}

async function consultar(){
  const ss = sessao();
  if(!ss){ paraOLogin(); return; }

  btnRecarregar.disabled = true;
  btnRecarregar.innerHTML = '<i class="fas fa-circle-notch girando"></i> Consultando\u2026';
  mostrarEstado('fa-circle-notch girando', 'Consultando\u2026');
  elBlocoData.hidden = true;

  let r = null;
  try{
    const res = await fetch(ENDPOINT, { method:'POST', body: JSON.stringify({acao: ACAO, token: ss.token}) });
    r = await res.json();
  }catch(_){ r = null; }
  if(!r) r = await pedirJsonp(ss.token);

  btnRecarregar.disabled = false;
  btnRecarregar.innerHTML = '<i class="fas fa-rotate"></i> Atualizar';

  if(!r){
    mostrarEstado('fa-wifi', 'Sem conex\u00e3o com o servidor.<br>Esta consulta precisa de internet \u2014 '
      + 'conecte e toque em <b>Atualizar</b>.', 'erro');
    return;
  }
  if(r.sessao === false){
    mostrarEstado('fa-right-to-bracket', esc(r.erro || 'Sess\u00e3o expirada.') + '<br>Voltando para a tela de entrada\u2026', 'erro');
    setTimeout(paraOLogin, 2200);
    return;
  }
  if(!r.ok){
    mostrarEstado('fa-triangle-exclamation', esc(r.erro || 'N\u00e3o foi poss\u00edvel consultar agora.'), 'erro');
    return;
  }
  if(r.atualizadoEm){ elData.textContent = r.atualizadoEm; elBlocoData.hidden = false; }
  ATUAL = r;
  mostrar(r);
}

btnRecarregar.addEventListener('click', consultar);
consultar();

})();
</script>
